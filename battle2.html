// ── SPRITE ──
const MAX_LEVEL = 99;

function getLevelFillPct(participant) {
  const threshold = (participant.level + 1) * 100;
  return Math.min(100, (participant.levelDamage / threshold) * 100);
}

function updateAvatarSprite(participant) {
  const row = document.querySelector(`tr[data-participant-id="${participant.id}"]`);
  if (!row) return;
  const lvlBig = row.querySelector(".avatar-lvl-big");
  const xpFill = row.querySelector(".avatar-xp-fill");
  if (lvlBig) lvlBig.textContent = participant.level;
  if (xpFill)  xpFill.style.width = getLevelFillPct(participant) + "%";
}

// ── LEVEL UP LOGIC ──
function applyDamageToLevel(participant, dmg) {
  participant.levelDamage += dmg;
  const threshold = (participant.level + 1) * 100;
  if (participant.levelDamage >= threshold && participant.level < MAX_LEVEL) {
    participant.level = participant.level + 1;
    participant.levelDamage = 0;
    addLogEntry(`⬆ ${participant.name} достиг уровня ${participant.level}!`);
  }
  updateAvatarSprite(participant);
}
function getAvatarColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  return { bg: `hsl(${hue},42%,28%)`, stripe: `hsl(${hue},55%,48%)` };
}

// Random rotation for dice: realistic "thrown on table" scatter
function randDieTransform() {
  const rot  = (Math.random() * 30 - 15);    // -15..+15 deg
  const tx   = (Math.random() * 4 - 2);      // -2..+2px lateral drift
  const ty   = (Math.random() * 6 - 3);      // -3..+3px vertical drift
  return { rot, tx, ty };
}

// Sprite: dice_sprite.png, 108×90, cell=18×18
// die value → (col, row) in sprite
const DIE_COORDS = {
  1: [1,4], 2: [2,4], 3: [3,4], 4: [4,4],
  5: [5,0], 6: [5,1], 7: [5,2], 8: [5,3],
};
const SPRITE_CELL = 18;
const DIE_DISPLAY = 52; // rendered px

// Preload sprite sheet once
const _diceSprite = new Image();
_diceSprite.src = "dice_sprite.png";

// Die highlight: value 1-8 → blue→red progression, painted as overlay on white pixels
// We sample the canvas pixel-by-pixel and tint only bright pixels (the highlight area)
const DIE_HIGHLIGHT_COLORS = {
  1: [80,  140, 220], // deep blue
  2: [60,  180, 200], // teal-blue
  3: [80,  200, 120], // green
  4: [160, 210,  60], // yellow-green
  5: [220, 200,  40], // yellow
  6: [230, 140,  30], // orange
  7: [220,  70,  30], // orange-red
  8: [200,  30,  30], // red
};

// Two dice per throw: d1 shifts up, d2 shifts down — opposite corners feel
function makePairTransforms() {
  const r1  = (Math.random() * 22 - 11);
  const r2  = (Math.random() * 22 - 11);
  const jx1 = (Math.random() * 4 - 2);
  const jx2 = (Math.random() * 4 - 2);
  const OFFSET = 18; // px vertical separation
  return [
    { rot: r1, tx: jx1, ty: -(OFFSET + Math.random() * 6) },  // up
    { rot: r2, tx: jx2, ty:  (OFFSET + Math.random() * 6) },  // down
  ];
}

function createSpriteDie(value, transform) {
  const canvas = document.createElement("canvas");
  canvas.width  = DIE_DISPLAY;
  canvas.height = DIE_DISPLAY;
  canvas.classList.add("dice", "appear");
  canvas.style.width         = DIE_DISPLAY + "px";
  canvas.style.height        = DIE_DISPLAY + "px";
  canvas.style.display       = "block";
  canvas.style.flexShrink    = "0";
  canvas.style.imageRendering = "pixelated";

  function draw() {
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, DIE_DISPLAY, DIE_DISPLAY);
    const [col, row] = DIE_COORDS[value] || [0,0];
    ctx.drawImage(
      _diceSprite,
      col * SPRITE_CELL, row * SPRITE_CELL, SPRITE_CELL, SPRITE_CELL,
      0, 0, DIE_DISPLAY, DIE_DISPLAY
    );

    // Tint highlight using compositing — no pixel read, no CORS issue
    const [hr, hg, hb] = DIE_HIGHLIGHT_COLORS[value] || [255, 255, 255];
    ctx.globalCompositeOperation = "source-atop";
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = `rgb(${hr},${hg},${hb})`;
    ctx.fillRect(0, 0, DIE_DISPLAY, DIE_DISPLAY);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }

  if (_diceSprite.complete && _diceSprite.naturalWidth > 0) {
    draw();
  } else {
    _diceSprite.addEventListener("load", draw, { once: true });
  }

  const { rot, tx, ty } = transform || { rot: 0, tx: 0, ty: 0 };
  canvas.style.setProperty("--die-rot", rot + "deg");
  canvas.style.setProperty("--die-y",   ty + "px");

  const finalTransform = `translateX(${tx}px) translateY(${ty}px) rotate(${rot}deg)`;
  setTimeout(() => {
    canvas.classList.remove("appear");
    canvas.style.transform = finalTransform;
  }, 240);

  return canvas;
}

// ── DICE STRIP (throw groups) ──
function buildDiceStrip(throwGroups) {
  const strip = document.createElement("div");
  strip.className = "dice-strip";

  if (!throwGroups || throwGroups.length === 0) {
    const ph = document.createElement("span");
    ph.className = "dice-empty";
    ph.textContent = "· · ·";
    strip.appendChild(ph);
    return strip;
  }

  throwGroups.forEach((pair, i) => {
    if (i > 0) {
      const sep = document.createElement("div");
      sep.className = "dice-sep";
      strip.appendChild(sep);
    }
    const group = document.createElement("div");
    group.className = "dice-throw";
    const [t1, t2] = makePairTransforms();
    if (pair[0] >= 1 && pair[0] <= 8) group.appendChild(createSpriteDie(pair[0], t1));
    if (pair[1] >= 1 && pair[1] <= 8) group.appendChild(createSpriteDie(pair[1], t2));
    strip.appendChild(group);
  });

  return strip;
}

// ── PLAYER HP BAR ──
function maxHpOf(p) { return p.maxHp || 100; }

function updatePlayerHpBar(wrapEl, hp, maxHp = 100) {
  const fill = wrapEl.querySelector(".player-hp-fill");
  if (!fill) return;
  const pct = Math.max(0, Math.min(100, hp / maxHp * 100));
  fill.style.height = pct + "%";
  const defeated = wrapEl.querySelector(".player-hp-defeated");
  if (defeated) {
    if (hp <= 0) defeated.classList.add("visible");
    else          defeated.classList.remove("visible");
  }
}

function setPlayerHP(participantId, hp) {
  const p = participants.find(x => x.id === participantId);
  if (!p) return;
  p.hp = Math.max(0, Math.min(maxHpOf(p), hp));
  const wrap = document.querySelector(`.player-hp-wrap[data-hp-id="${participantId}"]`);
  if (wrap) updatePlayerHpBar(wrap, p.hp, maxHpOf(p));
}

// ── RENDER ──
function renderParticipants() {
  participantsBody.innerHTML = "";
  participants.forEach((p) => {
    const tr = document.createElement("tr");
    tr.dataset.participantId = p.id;
    tr.classList.add("colored");

    const { card, stripe } = createAvatarCard(p);
    tr.style.setProperty("--row-stripe", stripe);

    // Avatar + name card (single cell)
    const tdA = document.createElement("td");
    tdA.className = "cell-avatar";

    // HP bar wrap (130×130, same as avatar)
    const hpWrap = document.createElement("div");
    hpWrap.className = "player-hp-wrap";
    hpWrap.dataset.hpId = p.id;

    const hpFillEl = document.createElement("div");
    hpFillEl.className = "player-hp-fill";
    const hpNotches = document.createElement("div");
    hpNotches.className = "player-hp-notches";
    const hpDefeated = document.createElement("div");
    hpDefeated.className = "player-hp-defeated";
    const hpDefeatedText = document.createElement("span");
    hpDefeatedText.textContent = "Повержен";
    hpDefeated.appendChild(hpDefeatedText);
    hpWrap.appendChild(hpFillEl);
    hpWrap.appendChild(hpNotches);
    hpWrap.appendChild(hpDefeated);
    updatePlayerHpBar(hpWrap, p.hp ?? 100, maxHpOf(p));

    // Row: [HP bar] [avatar card]
    const cardRow = document.createElement("div");
    cardRow.className = "avatar-card-row";
    cardRow.appendChild(hpWrap);
    cardRow.appendChild(card);
    tdA.appendChild(cardRow);

    const tdD = document.createElement("td");
    tdD.className = "cell-dice";
    tdD.appendChild(buildDiceStrip(p.throws));

    tr.addEventListener("contextmenu", (e) => {
      // If click is on avatar card — that's rename (handled separately), skip delete
      if (e.target.closest(".avatar-card")) return;
      e.preventDefault();
      if (confirm(`Удалить «${p.name}»?`)) removeParticipant(p.id);
    });

    tr.append(tdA, tdD);
    participantsBody.appendChild(tr);
  });
}

// ── ADAPTIVE TWO-WORD NAME ──
// Renders name as one or two lines; if two words, scales second word
// so both lines have the same visual width.
function buildAdaptiveName(name, maxPx) {
  const wrap = document.createElement("div");
  wrap.className = "avatar-name";
  wrap.style.width = maxPx + "px";
  wrap.style.textAlign = "center";

  const words = name.trim().split(/\s+/);
  if (words.length === 1) {
    wrap.style.whiteSpace = "nowrap";
    wrap.style.overflow = "hidden";
    wrap.style.textOverflow = "ellipsis";
    wrap.textContent = name;
    return wrap;
  }

  const word1 = words[0];
  const word2 = words.slice(1).join(" ");
  const BASE_SIZE = 10; // px

  const mCanvas = document.createElement("canvas");
  const mCtx = mCanvas.getContext("2d");
  const FONT = `${BASE_SIZE}px 'Courier New', monospace`;
  mCtx.font = FONT;
  const w1     = mCtx.measureText(word1).width;
  const w2base = mCtx.measureText(word2).width;

  // Scale word2 to match word1 width, clamp 6–12px
  const scale = w1 / (w2base || 1);
  const size2 = Math.max(6, Math.min(12, Math.round(BASE_SIZE * scale)));

  const mkLine = (text, size) => {
    const d = document.createElement("div");
    d.textContent = text;
    d.style.fontSize      = size + "px";
    d.style.lineHeight    = "1.6";
    d.style.whiteSpace    = "nowrap";
    d.style.letterSpacing = "-0.5px";
    d.style.overflow      = "visible";
    return d;
  };

  wrap.appendChild(mkLine(word1, BASE_SIZE));
  const line2 = mkLine(word2, size2);
  line2.style.color = "var(--text-dim)";
  wrap.appendChild(line2);
  return wrap;
}

function createAvatarCard(participant) {
  const colors = getAvatarColor(participant.name);

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.style.borderColor = colors.stripe;
  avatar.title = "Дважды кликните — бросок 2d8";

  // Top: big level number
  const top = document.createElement("div");
  top.className = "avatar-top";
  const lvlBig = document.createElement("div");
  lvlBig.className = "avatar-lvl-big";
  lvlBig.textContent = participant.level;
  top.appendChild(lvlBig);

  // Bottom: xp bar + 3 corner-only slots
  const bottom = document.createElement("div");
  bottom.className = "avatar-bottom";

  const xpBar = document.createElement("div");
  xpBar.className = "avatar-xp-bar";
  const xpFill = document.createElement("div");
  xpFill.className = "avatar-xp-fill";
  xpFill.style.width = getLevelFillPct(participant) + "%";
  xpBar.appendChild(xpFill);

  const slots = document.createElement("div");
  slots.className = "avatar-slots";
  for (let i = 0; i < 3; i++) {
    const slot = document.createElement("div");
    slot.className = "avatar-slot";
    const inner = document.createElement("div");
    inner.className = "avatar-slot-inner";
    slot.appendChild(inner);
    slots.appendChild(slot);
  }

  bottom.appendChild(slots);
  bottom.appendChild(xpBar);
  avatar.appendChild(top);
  avatar.appendChild(bottom);

  const nameEl = buildAdaptiveName(participant.name, 130);

  const card = document.createElement("div");
  card.className = "avatar-card";
  card.appendChild(avatar);
  card.appendChild(nameEl);
  card.addEventListener("dblclick", () => handleParticipantAttack(participant, avatar));
  card.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    const newName = prompt("Новое имя:", participant.name);
    if (newName && newName.trim()) {
      participant.name = newName.trim();
      renderParticipants();
      addLogEntry(`✎ Переименован в «${participant.name}»`);
    }
  });

  return { card, stripe: colors.stripe };
}

// ── APPEND NEW THROW TO STRIP ──
// d1, d2: required dice. d3: optional bonus die (sword), shown in same group.
function appendThrowToStrip(participantId, d1, d2, d3 = null) {
  const row = document.querySelector(`tr[data-participant-id="${participantId}"]`);
  if (!row) return;
  const cell = row.querySelector(".cell-dice");
  if (!cell) return;

  let strip = cell.querySelector(".dice-strip");
  const ph = strip && strip.querySelector(".dice-empty");
  if (ph) ph.remove();

  if (!strip) {
    strip = document.createElement("div");
    strip.className = "dice-strip";
    cell.appendChild(strip);
  }

  // Separator before each new group (except first)
  if (strip.children.length > 0) {
    const sep = document.createElement("div");
    sep.className = "dice-sep";
    strip.appendChild(sep);
  }

  const group = document.createElement("div");
  group.className = "dice-throw";
  const [t1, t2] = makePairTransforms();
  group.appendChild(createSpriteDie(d1, t1));
  if (d2 !== null && d2 !== undefined) group.appendChild(createSpriteDie(d2, t2));
  if (d3 !== null && d3 !== undefined) {
    const [t3] = makePairTransforms();
    group.appendChild(createSpriteDie(d3, t3));
  }
  strip.appendChild(group);

  // After DOM settles, clip any individual dice that overlap the avatar cell
  requestAnimationFrame(() => clipDiceByProximity(row, strip));
}

// Hide dice and separators whose right edge crosses into the avatar cell.
function clipDiceByProximity(row, strip) {
  const avatarCell = row.querySelector(".cell-avatar");
  if (!avatarCell) return;

  const threshold = avatarCell.getBoundingClientRect().right;

  // Hide each die (canvas) if its left edge is at or before the avatar right edge
  strip.querySelectorAll("canvas.dice").forEach(die => {
    const r = die.getBoundingClientRect();
    die.style.visibility = r.left < threshold ? "hidden" : "visible";
  });

  // Hide each separator if its right edge overlaps the avatar cell
  strip.querySelectorAll(".dice-sep").forEach(sep => {
    const r = sep.getBoundingClientRect();
    sep.style.visibility = r.right <= threshold ? "hidden" : "visible";
  });

  // Remove any clip-path set previously
  strip.style.clipPath = "";
}

// ── PARTICIPANTS ──
function addParticipant(name) {
  const trimmed = name.trim();
  if (!trimmed) return;
  participants.push({ id: nextId++, name: trimmed, damage: 0, damageCurrent: 0, throws: [], level: 1, levelDamage: 0, hp: 100 });
  renderParticipants();
  addLogEntry(`${trimmed} вступил в бой`);
}

function removeParticipant(id) {
  participants = participants.filter(p => p.id !== id);
  renderParticipants();
}

// ── HP ──
function updateHP(animated = true) {
  const pct = MAX_HP > 0 ? Math.max(0, (currentHP / MAX_HP) * 100) : 0;
  hpFill.style.transition = animated ? "height 220ms steps(10)" : "none";
  hpFill.style.height = pct + "%";

  // Colour by percentage — roguelike palette
  hpFill.classList.remove("hp-high", "hp-mid", "hp-low", "hp-crit");
  if      (pct > 60) hpFill.classList.add("hp-high");
  else if (pct > 30) hpFill.classList.add("hp-mid");
  else if (pct > 15) hpFill.classList.add("hp-low");
  else               hpFill.classList.add("hp-crit");

  hpText.textContent    = MAX_HP > 0 ? (currentHP + "/" + MAX_HP) : "—";

  if (!animated) { void hpFill.offsetWidth; hpFill.style.transition = "height 220ms steps(10)"; }
}

// ── LOG ──
const LOG_LIMIT = 500; // записей всего (по всем дням)

function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" +
         String(d.getMonth() + 1).padStart(2, "0") + "-" +
         String(d.getDate()).padStart(2, "0");
}
function nowHM() {
  const d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" +
         String(d.getMinutes()).padStart(2, "0");
}
function fmtDay(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  return m ? `${m[3]}.${m[2]}.${m[1]}` : (iso || "без даты");
}

// text — строка; date — "YYYY-MM-DD" (по умолчанию сегодня); time — "ЧЧ:ММ"
function addLogEntry(text, date, time) {
  logEntries.unshift({ date: date || todayISO(), time: time || nowHM(), text });
  if (logEntries.length > LOG_LIMIT) logEntries.pop();
  renderLog();
}

function renderLog() {
  logContent.innerHTML = "";
  const byDate = new Map();
  logEntries.forEach(e => {
    if (!byDate.has(e.date)) byDate.set(e.date, []);
    byDate.get(e.date).push(e);
  });
  const days = [...byDate.keys()].sort().reverse(); // новые дни сверху
  const today = todayISO();

  days.forEach(day => {
    const entries = byDate.get(day);
    const head = document.createElement("div");
    head.className = "log-day-header" + (day === today ? " is-today" : "");
    const left = document.createElement("span");
    left.textContent = "── " + fmtDay(day) + (day === today ? " · сегодня" : "");
    const right = document.createElement("span");
    right.className = "log-day-count";
    right.textContent = entries.length;
    head.appendChild(left);
    head.appendChild(right);
    logContent.appendChild(head);

    entries.forEach(entry => {
      const div = document.createElement("div");
      div.className = "log-entry";
      const bullet = document.createElement("span");
      bullet.className = "log-bullet";
      bullet.textContent = "▸";
      div.appendChild(bullet);
      if (entry.time) {
        const t = document.createElement("span");
        t.className = "log-time";
        t.textContent = entry.time;
        div.appendChild(t);
      }
      const txt = document.createElement("span");
      txt.innerHTML = String(entry.text).replace(/(\d+)\s*ур/g, '<span class="dmg">$1 ур</span>');
      div.appendChild(txt);
      logContent.appendChild(div);
    });
  });

  logCount.textContent = logEntries.length + " записей · " + days.length + " дн.";
}

// Отпор: каждому игроку, нанёсшему урон, — свой случайный урон 5–25
function bossRetaliate() {
  const bossName = document.getElementById("boss-name-el")?.textContent || "Босс";
  const parts = [];
  participants.forEach(p => {
    if ((p.damageCurrent || 0) < 1 || (p.hp ?? 100) <= 0) return;
    const d = 5 + Math.floor(Math.random() * 21);
    setPlayerHP(p.id, (p.hp ?? 100) - d);
    parts.push(`${p.name} −${d}`);
  });
  if (parts.length) addLogEntry(`🐺 ${bossName} даёт отпор! ${parts.join(", ")} HP`);
}

// Вампир Монарх: каждый круг высасывает 8–20 HP у случайного живого игрока и лечится на столько же
function bossDrain() {
  const alive = participants.filter(p => (p.hp ?? 100) > 0);
  if (!alive.length) return;
  const victim = alive[Math.floor(Math.random() * alive.length)];
  const got = Math.min(8 + Math.floor(Math.random() * 13), victim.hp ?? 100);
  setPlayerHP(victim.id, (victim.hp ?? 100) - got);
  currentHP = Math.min(MAX_HP, currentHP + got);
  updateHP();
  const bossName = document.getElementById("boss-name-el")?.textContent || "Босс";
  addLogEntry(`🧛 ${bossName} высасывает ${got} HP у ${victim.name}`);
}

// Наградной лут встаёт первым в инвентаре, сдвигая остальное
function giveItemToFront(participant, item) {
  if (!participant.items) participant.items = [];
  if (participant.items.find(i => i.id === item.id)) { giveItemToParticipant(participant, item); return; }
  const def = LOOT_ITEMS.find(i => i.id === item.id);
  participant.items.unshift({ ...item, count: 1, uses: def ? def.uses : undefined });
  const row = document.querySelector(`tr[data-participant-id="${participant.id}"]`);
  const slotsEl = row && row.querySelector(".avatar-slots");
  if (!slotsEl) return;
  const slots = [...slotsEl.querySelectorAll(".avatar-slot")];
  const emptyIdx = slots.map(sl => !sl.querySelector("img")).lastIndexOf(true);
  if (emptyIdx !== -1) slots[emptyIdx].remove();                   // освободили пустой слот в конце
  else if (slots.length >= 8) slots[slots.length - 1].remove();    // предел слотов
  const newSlot = makeSlot();
  slotsEl.insertBefore(newSlot, slotsEl.firstChild);
  refreshSlotLayout(slotsEl);
  removeWhiteBackground(item.src, cleanSrc => {
    const img = document.createElement("img");
    img.src = cleanSrc;
    img.dataset.itemId = item.id;
    img.style.cssText = "width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block;";
    img.title = item.name;
    img.style.animation = "lootSlotDrop 350ms steps(5) forwards";
    newSlot.appendChild(img);
  });
}

// Раздача наградного лута: кубок — игроку с максимальным уровнем, звезда — всем выжившим
function giveRewardLoot(rewardIds) {
  // вставляем в начало в обратном порядке: сначала звезда, затем кубок — кубок окажется первым
  const defs = [...new Set(rewardIds)]
    .map(id => LOOT_ITEMS.find(i => i.id === id)).filter(Boolean)
    .sort((x, y) => (y.rewardOrder || 0) - (x.rewardOrder || 0));
  defs.forEach(it => {
    let targets = [];
    if (it.reward === "top_level") {
      const top = [...participants].sort((x, y) =>
        ((y.level || 1) - (x.level || 1)) ||
        ((y.levelDamage || 0) - (x.levelDamage || 0)) ||
        ((y.damage || 0) - (x.damage || 0)))[0];
      if (top) targets = [top];
    } else if (it.reward === "alive") {
      targets = participants.filter(p => (p.hp ?? 100) > 0);
    }
    targets.forEach(p => giveItemToFront(p, { name: it.name, src: it.src, id: it.id }));
    if (targets.length) addLogEntry(`🏆 ${it.name} → ${targets.map(p => p.name).join(", ")}`);
  });
}

// Клыки: раздать HP поровну (по 1 за круг) всем живым, у кого < 100
function healParticipantsEvenly(total) {
  let left = total;
  let pool = participants.filter(p => (p.hp ?? 100) > 0 && (p.hp ?? 100) < maxHpOf(p));
  while (left > 0 && pool.length) {
    pool.forEach(p => {
      if (left > 0 && (p.hp ?? 100) < maxHpOf(p)) { setPlayerHP(p.id, (p.hp ?? 100) + 1); left--; }
    });
    pool = pool.filter(p => (p.hp ?? 100) < maxHpOf(p));
  }
}

// ── ATTACK ──
function handleParticipantAttack(participant, avatarEl) {
  if (!battleStarted) {
    battleStarted = true;
    if (!spawnNext()) { battleStarted = false; return; } // очередь пуста — не добавлены боссы
  }
  if (currentHP <= 0) return;
  // Blocked if HP = 0
  if ((participant.hp ?? 100) <= 0) {
    addLogEntry(`${participant.name} повержен и не может атаковать!`);
    return;
  }

  // «Ход» = совокупное число ударов от всех участников, а не круг,
  // в котором обязан отметиться каждый — иначе бой стопорится на самом
  // медленном игроке. 1 ход = столько ударов, сколько сейчас участников.
  totalHitsGlobal = (totalHitsGlobal || 0) + 1;
  {
    const playersCount = Math.max(1, participants.length);
    const roundsDone = Math.floor(totalHitsGlobal / playersCount);
    if (roundsDone > totalTurns) totalTurns = roundsDone;
  }
  updateTurnCounter();

  avatarEl.classList.add("attacking");
  setTimeout(() => avatarEl.classList.remove("attacking"), 320);
  const slash = document.createElement("div");
  slash.className = "slash";
  avatarEl.appendChild(slash);
  setTimeout(() => slash.remove(), 260);

  // ── Кость: на следующем ходу превращается в случайный мобовский лут ──
  if (participantItemCount(participant, "bone") > 0) {
    consumeOneItem(participant, "bone"); // стак: по одной кости за ход
    const pool = MOB_DEFS.flatMap(m => m.lootCycle);
    const it = LOOT_ITEMS.find(x => x.id === pool[Math.floor(Math.random() * pool.length)]);
    if (it) {
      giveItemToParticipant(participant, { name: it.name, src: it.src, id: it.id });
      addLogEntry(`🦴 Кость ${participant.name} превратилась в: ${it.name}`);
    }
  }

  // ── Брусника: на следующем ходу +20 макс. HP навсегда (стак — по одной за ход) ──
  if (participantItemCount(participant, "lingonberry") > 0) {
    consumeOneItem(participant, "lingonberry");
    participant.maxHp = maxHpOf(participant) + 20;
    setPlayerHP(participant.id, (participant.hp ?? 100) + 20);
    addLogEntry(`🫐 ${participant.name}: макс. HP +20 (теперь ${participant.maxHp})`);
  }

  let d1 = Math.floor(Math.random() * 8) + 1;
  let d2 = Math.floor(Math.random() * 8) + 1;

  // ── Зазубренный Кинжал: минимум кубика = 1 + кол-во кинжалов ──
  const daggerCount = participantItemCount(participant, "dagger");
  if (daggerCount > 0) {
    const minVal = 1 + daggerCount;
    if (d1 === 1) d1 = minVal;
    if (d2 === 1) d2 = minVal;
  }

  let dmg = d1 + d2;
  const baseDmg = dmg; // before bonuses

  // ── Золотой Дублон: дубли → +baseDmg за каждый дублон ──
  let doubloonBonus = 0;
  const doubloonCount = participantItemCount(participant, "doubloon");
  if (doubloonCount > 0 && d1 === d2) {
    doubloonBonus = baseDmg * doubloonCount;
    dmg += doubloonBonus;
  }

  // ── Меч: 20% per sword, +1d8 ──
  let doubleSword = false, d3 = 0;
  const swordCount = participantItemCount(participant, "leprechaun_sword");
  if (swordCount > 0 && Math.random() < (0.20 * swordCount)) {
    doubleSword = true;
    d3 = Math.floor(Math.random() * 8) + 1;
    dmg += d3;
  }

  // Store last die for Pitchfork
  participant.lastDie = d2; // last rolled die (rightmost)
  if (!participant.turnCount) participant.turnCount = 0;
  participant.turnCount++;

  // Store throw
  if (!participant.throws) participant.throws = [];
  participant.throws.push([d1, d2]);
  if (participant.throws.length > 6) participant.throws.shift();

  appendThrowToStrip(participant.id, d1, d2, doubleSword ? d3 : null);

  setTimeout(() => {
    if (currentHP <= 0) return; // enemy already killed by an earlier hit
    let finalDmg = dmg;

    // ── Вилы: каждые 3 хода копируют последний кубик ──
    let pitchforkDmg = 0;
    const pitchforkCount = participantItemCount(participant, "pitchfork");
    if (pitchforkCount > 0 && participant.turnCount % 3 === 0) {
      pitchforkDmg = (participant.lastDie || 0) * pitchforkCount;
      finalDmg += pitchforkDmg;
    }

    // ── Сердце Вампира: раз в 6 ходов двойной урон, −10% HP владельца, 3 срабатывания ──
    let heartDmg = 0, heartCost = 0;
    const heart = participant.items && participant.items.find(i => i.id === "vampire_heart");
    if (heart) {
      heart.tick = (heart.tick || 0) + 1;
      // готово после 6 ходов, но срабатывает только если у владельца HP > 10, иначе ждёт
      if (heart.tick >= 6 && (participant.hp ?? 100) > 10) {
        heart.tick = 0;
        heartDmg = finalDmg;          // ровно ×2, стак не усиливает
        finalDmg += heartDmg;
        heartCost = Math.round(maxHpOf(participant) * 0.10);
        setPlayerHP(participant.id, Math.max(1, (participant.hp ?? 100) - heartCost));
        heart.uses = (heart.uses ?? 3) - 1;
        if (heart.uses <= 0) {         // это сердце потрачено — со следующего хода следующее
          const restHearts = (heart.count || 1) - 1;
          consumeOneItem(participant, "vampire_heart");
          if (restHearts > 0) heart.uses = 3;
        }
      }
    }

    // ── Гоблинская Бомба: +25 урона, одноразовая ──
    let bombDmg = 0;
    const bombCount = participantItemCount(participant, "goblin_bomb");
    if (bombCount > 0) {
      bombDmg = 25 * bombCount; // every bomb in the stack explodes
      finalDmg += bombDmg;
      removeItemFromParticipant(participant, "goblin_bomb");
    }

    // ── Ключик: сжигает 25% HP, только у Леприкона; стак — по одному ключу за удар ──
    let keyDmg = 0;
    if (participantItemCount(participant, "key") > 0 && currentEnemyId === "leprechaun") {
      keyDmg = Math.round(MAX_HP * 0.25);
      finalDmg += keyDmg;
      consumeOneItem(participant, "key");
    }

    // ── Клыки: −10% HP врага, поровну лечат раненых; стак — по одному за удар ──
    let fangDmg = 0;
    if (participantItemCount(participant, "fangs") > 0) {
      fangDmg = Math.min(Math.round(MAX_HP * 0.10), Math.max(0, currentHP - finalDmg));
      finalDmg += fangDmg;
      consumeOneItem(participant, "fangs");
      healParticipantsEvenly(fangDmg);
    }

    // ── Череп: весь урон ×2 на следующем боссе ──
    let skullOn = false;
    if (participant.skullActive && currentEnemyId === null) { finalDmg *= 2; skullOn = true; }

    participant.damage += finalDmg;
    participant.damageCurrent = (participant.damageCurrent || 0) + finalDmg;
    applyDamageToLevel(participant, finalDmg);
    currentHP = Math.max(0, currentHP - finalDmg);
    totalDamage += finalDmg;
    updateHP();
    const _pColor = getAvatarColor(participant.name).stripe;
    showFloatingDamage(finalDmg, _pColor);
    flashBossHit();

    // ── Базовая регенерация +5 HP за ход (только если hp > 0) ──
    if ((participant.hp ?? 100) > 0) {
      setPlayerHP(participant.id, (participant.hp ?? 100) + 5);
    }

    // ── Regen from Hay (+5hp за стак, только если hp > 0) ──
    const hayCount = participantItemCount(participant, "hay");
    if (hayCount > 0 && (participant.hp ?? 100) > 0) {
      const regen = 5 * hayCount;
      setPlayerHP(participant.id, (participant.hp ?? 100) + regen);
    }

    // Log
    let logParts = [];
    if (doubloonCount > 0 && d1 === d2) logParts.push(`🪙 ДУБЛЬ! +${doubloonBonus} (×${doubloonCount} дублон)`);
    if (doubleSword) logParts.push(`⚔ МЕЧ +${d3}`);
    if (pitchforkDmg) logParts.push(`🌾 ВИЛЫ +${pitchforkDmg} (ход ${participant.turnCount})`);
    if (bombDmg) logParts.push(`💣 БОМБА +${bombDmg}`);
    if (heartDmg) logParts.push(`🫀 СЕРДЦЕ +${heartDmg} (−${heartCost} HP)`);
    if (keyDmg) logParts.push(`🗝 КЛЮЧ +${keyDmg}`);
    if (skullOn) logParts.push(`💀 ЧЕРЕП ×2`);
    if (fangDmg) logParts.push(`🦷 КЛЫКИ +${fangDmg}, лечение отряда`);
    const suffix = logParts.length ? ` [${logParts.join(" | ")}]` : "";
    addLogEntry(`${participant.name} бросил 2d8: ${d1}+${d2} = <span class="dmg">${finalDmg} ур</span>${suffix}`);
    if ((currentEnemyRetaliates || currentEnemyDrains) && currentHP > 0) {
      // «ход» = совокупное число ударов по текущему врагу; никого не ждём —
      // если один игрок бьёт чаще, отработка способностей идёт по факту ударов.
      enemyHits = (enemyHits || 0) + 1;
      const playersCount = Math.max(1, participants.length);
      const rounds = Math.floor(enemyHits / playersCount);
      while (enemyRoundsDone < rounds && currentHP > 0) {
        enemyRoundsDone++;
        if (currentEnemyDrains && currentHP <= MAX_HP * currentDrainThreshold) bossDrain();
        if (currentEnemyRetaliates && enemyRoundsDone % 3 === 0) bossRetaliate();
      }
    }
    if (currentHP <= 0) {
      // Череп пропадает вместе с гибелью босса (до раздачи лута — новый череп будет для следующего)
      participants.forEach(p => {
        if (p.skullActive) { p.skullActive = false; consumeOneItem(p, "skull"); addLogEntry(`💀 Череп ${p.name} рассыпался`); }
      });
      const rewardIds = currentLootIds.filter(id => {
        const it = LOOT_ITEMS.find(i => i.id === id); return it && it.reward;
      });
      if (rewardIds.length) giveRewardLoot(rewardIds);
      const eligible = participants.filter(p => (p.damageCurrent || 0) >= 1);
      if (eligible.length > 0) {
        currentLootIds.filter(Boolean).forEach(id => {
          const it = LOOT_ITEMS.find(i => i.id === id);
          if (!it || it.reward) return;
          const winner = eligible[Math.floor(Math.random() * eligible.length)]; // отдельный розыгрыш на каждый предмет
          giveItemToParticipant(winner, { name: it.name, src: it.src, id: it.id });
          addLogEntry(`☠ Повержен! 🗡 ${it.name} → ${winner.name}!`);
        });
      } else if (!rewardIds.length) {
        addLogEntry("☠ Повержен! Некому наградить...");
      }
      scheduleNextSpawn();
    }
  }, 180);
}

// Track placed damage numbers to avoid overlap
const _dmgPositions = [];

function showFloatingDamage(dmg, color) {
  const layer = document.getElementById("boss-dmg-layer");
  if (!layer) return;

  const layerRect = layer.getBoundingClientRect();
  const W = layerRect.width  || layer.offsetWidth  || 300;
  const H = layerRect.height || layer.offsetHeight || 260;

  // Measure forbidden zones: boss-name and boss-loot-wrap, relative to layer
  const forbidden = [];
  ["boss-name-el", "boss-loot-wrap"].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const r = el.getBoundingClientRect();
    // expand by 14px margin
    forbidden.push({
      x1: r.left - layerRect.left - 14,
      y1: r.top  - layerRect.top  - 14,
      x2: r.right  - layerRect.left + 14,
      y2: r.bottom - layerRect.top  + 14,
    });
  });

  const ITEM_W = 56; // approx rendered width of label
  const ITEM_H = 18;
  const EDGE   = 10; // keep away from edges so text isn't clipped
  const MIN_DIST = 38;

  function inForbidden(x, y) {
    // check the label rect (top-left anchor)
    const cx = x + ITEM_W / 2, cy = y + ITEM_H / 2;
    return forbidden.some(z => cx > z.x1 && cx < z.x2 && cy > z.y1 && cy < z.y2);
  }

  function tooClose(x, y) {
    return _dmgPositions.some(p => {
      const dx = p.x - x, dy = p.y - y;
      return Math.sqrt(dx*dx + dy*dy) < MIN_DIST;
    });
  }

  let lx, ly, attempts = 0;
  do {
    lx = EDGE + Math.random() * (W - ITEM_W - EDGE * 2);
    ly = EDGE + Math.random() * (H - ITEM_H - EDGE * 2);
    attempts++;
    if (!inForbidden(lx, ly) && !tooClose(lx, ly)) break;
  } while (attempts < 60);

  _dmgPositions.push({ x: lx, y: ly });

  const num = document.createElement("div");
  num.className = "float-dmg";
  num.textContent = `-${dmg}`;
  num.style.left  = lx + "px";
  num.style.top   = ly + "px";
  num.style.color = color || "var(--damage)";
  layer.appendChild(num);
}

function clearBossDamageNumbers() {
  const layer = document.getElementById("boss-dmg-layer");
  if (layer) layer.innerHTML = "";
  _dmgPositions.length = 0;
}

function flashBossHit() {
  const flash = document.createElement("div");
  flash.style.cssText = "position:absolute;inset:0;background:rgba(180,30,30,0.35);z-index:20;pointer-events:none;";
  bossArt.appendChild(flash);
  setTimeout(() => flash.remove(), 140);
}

// ── ITEM SYSTEM ──

// Remove near-white background pixels → transparent
function removeWhiteBackground(imgSrc, cb) {
  if (KEEP_ALPHA.has(imgSrc)) { cb(imgSrc); return; }
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0);
    const idata = ctx.getImageData(0, 0, c.width, c.height);
    const d = idata.data;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i] >= 210 && d[i+1] >= 210 && d[i+2] >= 210) d[i+3] = 0;
    }
    ctx.putImageData(idata, 0, 0);
    cb(c.toDataURL("image/png"));
  };
  img.src = imgSrc;
}

// Place item into first empty avatar slot
function makeSlot() {
  const slot = document.createElement("div");
  slot.className = "avatar-slot";
  const inner = document.createElement("div");
  inner.className = "avatar-slot-inner";
  slot.appendChild(inner);
  return slot;
}

function refreshSlotLayout(slotsEl) {
  const count = slotsEl.querySelectorAll(".avatar-slot").length;
  // Remove old size classes
  slotsEl.classList.remove("slots-4","slots-5","slots-6","slots-7","slots-8");
  if (count >= 4) slotsEl.classList.add("slots-" + Math.min(count, 8));
}

function giveItemToParticipant(participant, item) {
  if (!participant.items) participant.items = [];

  // Check if already has this item — stack it
  const existing = participant.items.find(i => i.id === item.id);
  if (existing) {
    existing.count = (existing.count || 1) + 1;
    // Update stack count badge in slot
    const row = document.querySelector(`tr[data-participant-id="${participant.id}"]`);
    if (row) {
      const allSlots = row.querySelectorAll(".avatar-slot");
      for (const s of allSlots) {
        const img = s.querySelector("img");
        if (img && img.dataset.itemId === item.id) {
          let badge = s.querySelector(".slot-count");
          if (!badge) {
            badge = document.createElement("span");
            badge.className = "slot-count";
            s.appendChild(badge);
          }
          badge.textContent = "×" + existing.count;
          break;
        }
      }
    }
    return;
  }

  // New unique item — push to list
  const defN = LOOT_ITEMS.find(i => i.id === item.id);
  participant.items.push({ ...item, count: 1, uses: defN ? defN.uses : undefined });

  const row = document.querySelector(`tr[data-participant-id="${participant.id}"]`);
  if (!row) return;

  const slotsEl = row.querySelector(".avatar-slots");
  if (!slotsEl) return;

  // Find empty slot or create a new one
  let targetSlot = null;
  for (const s of slotsEl.querySelectorAll(".avatar-slot")) {
    if (!s.querySelector("img")) { targetSlot = s; break; }
  }
  if (!targetSlot) {
    // All slots occupied — add a new one (max 8)
    const currentCount = slotsEl.querySelectorAll(".avatar-slot").length;
    if (currentCount >= 8) return; // hard cap
    targetSlot = makeSlot();
    slotsEl.appendChild(targetSlot);
    refreshSlotLayout(slotsEl);
  }

  removeWhiteBackground(item.src, (cleanSrc) => {
    const img = document.createElement("img");
    img.src = cleanSrc;
    img.dataset.itemId = item.id;
    img.style.cssText = "width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block;";
    img.title = item.name;
    img.style.animation = "lootSlotDrop 350ms steps(5) forwards";
    targetSlot.appendChild(img);
  });
}

function participantHasItem(participant, itemId) {
  return !!(participant.items && participant.items.some(i => i.id === itemId));
}

function removeItemFromParticipant(participant, itemId) {
  if (!participant.items) return;
  const idx = participant.items.findIndex(i => i.id === itemId);
  if (idx === -1) return;
  participant.items.splice(idx, 1);
  const row = document.querySelector(`tr[data-participant-id="${participant.id}"]`);
  if (!row) return;
  const slotsEl = row.querySelector(".avatar-slots");
  if (!slotsEl) return;
  const slots = slotsEl.querySelectorAll(".avatar-slot");
  for (const s of slots) {
    const img = s.querySelector("img");
    if (img && img.dataset.itemId === itemId) {
      img.remove();
      const badge = s.querySelector(".slot-count");
      if (badge) badge.remove();
      // Remove the now-empty slot if we have more than 3
      const remaining = slotsEl.querySelectorAll(".avatar-slot").length;
      if (remaining > 3) s.remove();
      refreshSlotLayout(slotsEl);
      break;
    }
  }
}

function participantItemCount(participant, itemId) {
  const item = participant.items && participant.items.find(i => i.id === itemId);
  return item ? (item.count || 1) : 0;
}

// Боссовские предметы работают по очереди: тратится один предмет из стака
function consumeOneItem(participant, itemId) {
  const it = participant.items && participant.items.find(i => i.id === itemId);
  if (!it) return;
  if ((it.count || 1) <= 1) { removeItemFromParticipant(participant, itemId); return; }
  it.count--;
  const row = document.querySelector(`tr[data-participant-id="${participant.id}"]`);
  if (!row) return;
  for (const sl of row.querySelectorAll(".avatar-slot")) {
    const img = sl.querySelector("img");
    if (img && img.dataset.itemId === itemId) {
      const b = sl.querySelector(".slot-count");
      if (b) { if (it.count > 1) b.textContent = "×" + it.count; else b.remove(); }
      break;
    }
  }
}

const FEED_URL = "actions.json";
const FEED_INTERVAL_MS = 5 * 60 * 1000; // опрос раз в 5 минут
const feedSeen = new Set();

function findOrCreateParticipant(name) {
  const clean = String(name || "Аноним").trim().slice(0, 20);
  let p = participants.find(x => x.name.toLowerCase() === clean.toLowerCase());
  if (!p) {
    addParticipant(clean);
    p = participants[participants.length - 1];
  }
  return p;
}

function forumAttack(name, date, viaAdmin) {
  const p = findOrCreateParticipant(name);
  if (!p) return;
  const av = document.querySelector(`tr[data-participant-id="${p.id}"] .avatar`);
  if (av) handleParticipantAttack(p, av);
  const via = viaAdmin ? ` (записал админ ${viaAdmin})` : "";
  addLogEntry(`<span class="src-forum">⚔ форум</span> ${p.name} — «+атака»${via}`, date);
}

function forumSryv(name, date, viaAdmin) {
  const p = findOrCreateParticipant(name);
  if (!p) return;
  p.sryv = (p.sryv || 0) + 1;
  // тот же предмет «Урон −25 HP», что и на панели предметов (K)
  applyKItem({ id: "__damager__", name: "Урон\n−25 HP", isDamager: true }, p, date);
  const via = viaAdmin ? ` (записал админ ${viaAdmin})` : "";
  addLogEntry(
    `<span class="src-forum">✖ форум</span> ${p.name} — «!срыв» №${p.sryv}, −25 HP${via}`,
    date
  );
}

function forumJoin(name, date) {
  const existed = participants.some(x => x.name.toLowerCase() === String(name || "").trim().toLowerCase());
  const p = findOrCreateParticipant(name);
  if (!p) return;
  if (!existed) {
    addLogEntry(`<span class="src-forum">➕ форум</span> ${p.name} присоединился к бою`, date);
  }
}

// data: {events:[{id,date,author,target,command,post_id,is_admin_action}]}
function ingestFeed(data) {
  const items = Array.isArray(data) ? data : (data && data.events) || [];
  let applied = 0;
  items.slice()
    .sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")))
    .forEach(ev => {
      const key = ev.id || `${ev.post_id}:${ev.command}:${ev.pos}`;
      if (feedSeen.has(key)) return;
      feedSeen.add(key);
      applied++;
      const okDate = /^\d{4}-\d{2}-\d{2}$/.test(ev.date || "") && ev.date >= "2026-01-01";
      const date = okDate ? ev.date : todayISO();
      const who = ev.target || ev.author || "Аноним";
      const viaAdmin = ev.is_admin_action ? ev.author : null;
      if (ev.command === "attack")      forumAttack(who, date, viaAdmin);
      else if (ev.command === "sryv")   forumSryv(who, date, viaAdmin);
      else if (ev.command === "join")   forumJoin(who, date);
      else addLogEntry(`<span class="src-forum">форум</span> ${who}: ${ev.command}`, date);
    });
  return applied;
}
window.ingestFeed = ingestFeed; // можно скормить JSON вручную из консоли

window.RENDER_READY = false;   // используется внешним скринером: страница ждёт первого применения данных
let renderReadyTick = 0;

function markRenderReady() {
  renderReadyTick++;
  window.RENDER_READY = true;
  window.RENDER_READY_TICK = renderReadyTick;
  window.dispatchEvent(new CustomEvent("battle:render-ready", { detail: { tick: renderReadyTick } }));
}

async function pollFeed() {
  if (!FEED_URL) { markRenderReady(); return; }
  try {
    const r = await fetch(FEED_URL, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const n = ingestFeed(await r.json());
    if (n) console.log("Применено событий с форума:", n);
  } catch (e) {
    console.warn("Фид форума недоступен:", e);
  } finally {
    markRenderReady();
  }
}

async function init() {
  // Apply white background removal to boss loot icon on load
  const bossLootIcon = document.getElementById("boss-loot-icon");
  if (bossLootIcon && bossLootIcon.src) {
    const originalSrc = bossLootIcon.src;
    removeWhiteBackground(originalSrc, (cleanSrc) => {
      bossLootIcon.src = cleanSrc;
      // Also update LOOT_ITEMS registry
      const item = LOOT_ITEMS.find(i => i.id === "leprechaun_sword");
      if (item) item.src = cleanSrc;
    });
  }

  // 3 босса-пустышки по умолчанию (редактируются в «Настройка босса» → ✎)
  enqueueBoss({ name: "СКЕЛЕТ", loot: ["bone", "key"] });
  enqueueBoss({ name: "ВАМПИР", loot: ["vampire_heart", "fangs"] });
  enqueueBoss({ name: "ОБОРОТЕНЬ", loot: ["lingonberry", "skull"], retaliate: true });
  enqueueBoss({ name: "СКЕЛЕТ МАРОДЁР", loot: ["bone", "key"], qty: { bone: 2 } });
  enqueueBoss({ name: "ВАМПИР МОНАРХ", loot: ["vampire_heart", "fangs"], qty: { vampire_heart: 2 }, drain: true });
  enqueueBoss({ name: "ОБОРОТЕНЬ КАННИБАЛ", loot: ["champion_cup", "courage_star"], retaliate: true, drain: true, drainThreshold: 1 / 3 });

  renderParticipants();
  updateHP(false);

  addBtn.addEventListener("click", () => {
    addParticipant(nameInput.value);
    nameInput.value = "";
    nameInput.focus();
  });
  nameInput.addEventListener("keydown", e => {
    if (e.key === "Enter") { addParticipant(nameInput.value); nameInput.value = ""; }
  });

  addLogEntry("Нажмите на аватар, чтобы нанести первый удар — тогда появится враг!");

  await pollFeed();               // первое применение фида — после него страница «готова»
  if (FEED_URL) {
    setInterval(pollFeed, FEED_INTERVAL_MS);
  }
}

// ── AUTOBATTLE ──
// Every living player hits once per (1s / speed), hits are spread evenly across the interval.
function autoTick() {
  if (battleStarted && currentHP <= 0) return;
  const list = participants.filter(p => (p.hp ?? 100) > 0);
  const step = (1000 / autoSpeed) / Math.max(1, list.length);
  list.forEach((p, i) => setTimeout(() => {
    if (!autoOn) return;
    const av = document.querySelector(`tr[data-participant-id="${p.id}"] .avatar`);
    if (av) handleParticipantAttack(p, av);
  }, i * step));
}
function startAuto() { clearInterval(autoTimer); autoTimer = setInterval(autoTick, 1000 / autoSpeed); }
function updateAutoUI() {
  const t = document.getElementById("auto-toggle");
  t.textContent = autoOn ? "⏸ АВТОБОЙ" : "▶ АВТОБОЙ";
  t.classList.toggle("active", autoOn);
  document.querySelectorAll(".auto-btn.speed").forEach(b =>
    b.classList.toggle("active", parseInt(b.dataset.speed) === autoSpeed));
}
document.getElementById("auto-toggle").addEventListener("click", () => {
  autoOn = !autoOn;
  if (autoOn) { startAuto(); autoTick(); } else { clearInterval(autoTimer); autoTimer = null; }
  updateAutoUI();
  addLogEntry(autoOn ? `⚔ Автобой включён (${autoSpeed}x)` : "⏸ Автобой выключен");
});
document.querySelectorAll(".auto-btn.speed").forEach(b => b.addEventListener("click", () => {
  autoSpeed = parseInt(b.dataset.speed);
  if (autoOn) startAuto();
  updateAutoUI();
}));

// ── СЧЁТЧИК ХОДОВ (левый верхний угол, вкл/выкл по TAB) ──
let turnCounterVisible = false;
function ensureTurnCounterEl() {
  let el = document.getElementById("turn-counter");
  if (!el) {
    el = document.createElement("div");
    el.id = "turn-counter";
    el.style.cssText = [
      "position:fixed", "top:8px", "left:8px", "z-index:9999",
      "background:rgba(6,6,10,0.85)", "color:#e5c158",
      "border:1px solid #4a3e28", "box-shadow:2px 2px 0 #000",
      "font-family:'Press Start 2P','Courier New',monospace",
      "font-size:9px", "letter-spacing:1px",
      "padding:4px 7px", "pointer-events:none", "display:none",
    ].join(";");
    document.body.appendChild(el);
  }
  return el;
}
function updateTurnCounter() {
  const el = ensureTurnCounterEl();
  el.textContent = "ХОД: " + totalTurns;
}
function toggleTurnCounter() {
  turnCounterVisible = !turnCounterVisible;
  const el = ensureTurnCounterEl();
  el.style.display = turnCounterVisible ? "" : "none";
  updateTurnCounter();
}
document.addEventListener("keydown", e => {
  if (e.key === "Tab") {
    e.preventDefault(); // не даём табу переключать фокус
    toggleTurnCounter();
  }
});

init();
</script>
