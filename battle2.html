<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бой с боссом</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: 'CGCHR';
  src: url('CGCHR-Regular.otf') format('opentype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

img, .avatar, .dice, canvas {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  -ms-interpolation-mode: nearest-neighbor;
}

* { border-radius: 0 !important; box-sizing: border-box; }

:root {
  --bg:            #06060a;
  --panel:         #0e0e14;
  --panel2:        #090910;
  --row:           #0b0b12;
  --row-hover:     #111119;
  --accent:        #9a7a44;
  --accent-b:      #c5a05a;
  --gold:          #e5c158;
  --gold-dim:      #a8884a;
  --text:          #ccccc0;
  --text-dim:      #7a7a6a;
  --damage:        #cc4444;
  --damage-dim:    #8a2a2a;
  --border:        #2e2e3a;
  --border-accent: #4a3e28;
  --hp-full:       #7a1a1a;
  --hp-low:        #9a3a28;
  --hp-crit:       #c25040;
  --inset:         #1a1a24;
}

body {
  margin: 0;
  padding: 20px 32px 28px;
  background: var(--bg);
  color: var(--text);
  font-family: 'CGCHR', "Courier New", monospace;
  font-size: 14px;
  min-height: 100vh;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0a0a0f; }
::-webkit-scrollbar-thumb { background: var(--border-accent); }

.container { max-width: 100%; margin: 0; }

/* ── HEADER ── */
.header { text-align: center; margin-bottom: 18px; }
.header-deco {
  display: flex; align-items: center; justify-content: center;
  gap: 14px; margin-bottom: 4px;
}
.header-line {
  flex: 1; height: 2px; max-width: 260px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}
.title {
  font-family: 'Press Start 2P', monospace;
  font-size: 22px; font-weight: 400; letter-spacing: 5px;
  color: var(--gold); margin: 0;
  text-shadow: 0 0 24px rgba(229,193,88,0.25), 3px 3px 0 #000;
  text-transform: uppercase;
}
.header-sub {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px; color: var(--gold-dim);
  letter-spacing: 3px; margin-top: 6px; text-transform: uppercase;
}

/* ── ARENA ── */
.arena { display: flex; gap: 20px; align-items: stretch; margin-bottom: 16px; }

/* ── PANEL ── */
.panel {
  background: var(--panel);
  border: 2px solid var(--border-accent);
  box-shadow: 4px 4px 0 #000, inset 0 0 0 1px var(--inset);
  position: relative;
}
.panel::before {
  content: '';
  position: absolute; top: 3px; left: 3px; right: 3px; bottom: 3px;
  border: 1px solid var(--border);
  pointer-events: none; z-index: 0;
}
.panel-inner { position: relative; z-index: 1; }

/* ── PARTICIPANTS ── */
.participants {
  flex: 1; min-width: 0; padding: 0;
  display: flex; flex-direction: column;
  overflow: visible;
}
.participants .panel-inner {
  padding: 14px 16px 14px;
  display: flex; flex-direction: column; flex: 1;
  overflow: visible;
}

.section-head {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
}
.section-title {
  font-family: 'Press Start 2P', monospace;
  font-size: 10px; color: var(--gold);
  letter-spacing: 2px; text-transform: uppercase; white-space: nowrap;
}
.section-rule {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--border-accent), transparent);
}

/* ── TABLE ── */
.participants-table {
  width: 100%; border-collapse: separate; border-spacing: 0 3px; flex: 1;
  table-layout: fixed;
  overflow: visible;
}
.participants-table tbody { overflow: visible; }
.participants-table tbody tr { background: var(--row); cursor: default; overflow: visible; }
.participants-table tbody tr td { overflow: visible; }
.participants-table tbody tr:hover { background: var(--row-hover); }
.participants-table tbody tr td:first-child { border-left: none; padding-left: 14px; }

/* ── PLAYER CARD ── */
/* Player HP bar — width=26px (1/5 of avatar), height=130px (same as avatar) */
.player-hp-wrap {
  position: relative;
  width: 26px;
  height: 130px;
  flex-shrink: 0;
  margin-right: 4px;
  background: #0d0d0a;
  border: 2px solid var(--border-accent);
  box-shadow: 3px 3px 0 #000;
  overflow: hidden;
}
/* "Повержен" text overlay when HP = 0 */
.player-hp-defeated {
  display: none;
  position: absolute;
  inset: 0;
  align-items: center;
  justify-content: center;
  z-index: 5;
  background: rgba(0,0,0,0.55);
}
.player-hp-defeated.visible { display: flex; }
.player-hp-defeated span {
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  color: var(--damage);
  text-shadow: 1px 1px 0 #000;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  letter-spacing: 3px;
  text-transform: uppercase;
  line-height: 1;
}

/* Gradient fill layer — clipped from bottom by JS via height */
.player-hp-fill {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 100%;
  background: linear-gradient(to top, #c01818 0%, #e04010 35%, #e08010 70%, #c8a018 100%);
  transition: height 300ms steps(8);
}
/* 4 notch lines dividing segments */
.player-hp-notches {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(to bottom,
      transparent calc(25% - 1px), rgba(0,0,0,0.6) calc(25% - 1px), rgba(0,0,0,0.6) 25%,
      transparent 25%,
      transparent calc(50% - 1px), rgba(0,0,0,0.6) calc(50% - 1px), rgba(0,0,0,0.6) 50%,
      transparent 50%,
      transparent calc(75% - 1px), rgba(0,0,0,0.6) calc(75% - 1px), rgba(0,0,0,0.6) 75%,
      transparent 75%
    );
  z-index: 2;
}
/* Scanlines for texture */
.player-hp-wrap::after {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    to bottom, transparent, transparent 3px,
    rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
  );
  pointer-events: none; z-index: 3;
}

.cell-avatar {
  width: 150px;
  padding: 6px;
  vertical-align: top;
  position: relative;
}

.avatar-card-row {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 0;
}
.avatar-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: default;
  user-select: none;
  width: 130px;
}

/* Square: level number top half, slots bottom half */
.avatar {
  width: 130px; height: 130px;
  display: flex; flex-direction: column;
  align-items: stretch;
  box-shadow: 3px 3px 0 #000;
  border: 2px solid var(--border-accent);
  position: relative; overflow: hidden;
  font-family: 'Press Start 2P', monospace;
  image-rendering: pixelated;
  flex-shrink: 0;
  background: var(--panel2);
}
.avatar:hover { filter: brightness(1.15); }
.avatar.attacking { animation: strike 180ms steps(2); }
@keyframes strike {
  0%   { transform: scale(1) translateX(0); }
  50%  { transform: scale(1.08) translateX(2px); }
  100% { transform: scale(1) translateX(0); }
}
.avatar .slash {
  position: absolute; top: 10%; left: -40%; width: 50%; height: 3px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
  transform: rotate(-25deg); pointer-events: none; z-index: 3;
}

/* Top half: level number centered */
.avatar-top {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
}

/* Big level number */
.avatar-lvl-big {
  font-family: 'Press Start 2P', monospace;
  font-size: 40px;
  color: var(--gold);
  text-shadow: 3px 3px 0 #000, 0 0 16px rgba(229,193,88,0.2);
  line-height: 1;
}

/* Bottom section: xp bar + slots, same bg as card */
.avatar-bottom {
  background: var(--panel2);
  border-top: 1px solid var(--border-accent);
  padding: 4px 5px 5px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* XP progress bar — 5 segments, under slots */
.avatar-xp-bar {
  height: 8px;
  background: #0d0d0a;
  border: 1px solid var(--border-accent);
  position: relative; overflow: hidden;
  margin-top: 2px;
}
.avatar-xp-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: var(--gold-dim);
  transition: width 300ms steps(8);
}
/* 5-segment dividers over the fill */
.avatar-xp-bar::after {
  content: '';
  position: absolute; inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to right,
    transparent 0%,
    transparent calc(20% - 1px),
    rgba(0,0,0,0.6) calc(20% - 1px),
    rgba(0,0,0,0.6) 20%
  );
  z-index: 2;
}

/* 3 item slots row — corners only, no sides */
.avatar-slots {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  justify-content: center;
  width: 120px;
}
/* slot sizes by item count — JS adds class to .avatar-slots */
.avatar-slot {
  width: 28px; height: 28px;
  position: relative;
  flex-shrink: 0;
  transition: width 150ms steps(3), height 150ms steps(3);
}
.avatar-slots.slots-4 .avatar-slot { width: 24px; height: 24px; }
.avatar-slots.slots-5 .avatar-slot,
.avatar-slots.slots-6 .avatar-slot,
.avatar-slots.slots-7 .avatar-slot,
.avatar-slots.slots-8 .avatar-slot { width: 24px; height: 24px; }
/* corner-only border via pseudo + clip */
.avatar-slot::before,
.avatar-slot::after {
  content: '';
  position: absolute;
  width: 6px; height: 6px;
  border-color: var(--gold-dim);
  border-style: solid;
  opacity: 0.7;
}
.avatar-slot::before {
  top: 0; left: 0;
  border-width: 1px 0 0 1px;
}
.avatar-slot::after {
  bottom: 0; right: 0;
  border-width: 0 1px 1px 0;
}
/* additional corners via box-shadow trick on inner span */
.avatar-slot-inner {
  position: absolute; inset: 0;
}
.avatar-slot-inner::before,
.avatar-slot-inner::after {
  content: '';
  position: absolute;
  width: 6px; height: 6px;
  border-color: var(--gold-dim);
  border-style: solid;
  opacity: 0.7;
}
.avatar-slot-inner::before {
  top: 0; right: 0;
  border-width: 1px 1px 0 0;
}
.avatar-slot-inner::after {
  bottom: 0; left: 0;
  border-width: 0 0 1px 1px;
}

/* Name — in normal flow, no absolute, row height adapts */
.avatar-name {
  font-family: 'CGCHR', monospace;
  font-size: 11px;
  letter-spacing: -0.5px;
  color: var(--text);
  text-align: center;
  line-height: 1.6;
  width: 130px;
  padding: 3px 2px 0;
  transform: translateZ(0);
}

/* Dice cell: fixed width so it never pushes boss panel */
.cell-dice {
  padding: 4px 4px;
  vertical-align: middle;
  width: 100%;
  overflow: visible;
}

.dice-strip {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  justify-content: flex-end;
  gap: 0;
  height: 100%;
  min-height: 80px;
  overflow: visible;
  width: 100%;
}

/* each throw is a group of 2 dice */
.dice-throw {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* thin divider between throws */
.dice-sep {
  width: 1px;
  height: 80px;
  background: var(--border);
  flex-shrink: 0;
  margin: 0 6px;
  opacity: 0.7;
}

.dice {
  flex-shrink: 0;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* Die colour tinting by face value — roguelike palette, preserves readability */


@keyframes dieAppear {
  from { opacity: 0; transform: scale(0.2) rotate(var(--die-rot, 0deg)); }
  to   { opacity: 1; transform: translateY(var(--die-y, 0px)) rotate(var(--die-rot, 0deg)); }
}
.dice.appear { animation: dieAppear 200ms steps(4) forwards; }

@keyframes lootSlotDrop {
  0%   { opacity: 0; transform: scale(0) rotate(-30deg); }
  60%  { opacity: 1; transform: scale(1.2) rotate(5deg); }
  100% { opacity: 1; transform: scale(1) rotate(0deg); }
}
.avatar-slot img {
  filter: drop-shadow(0 0 4px var(--gold));
}
.slot-count {
  position: absolute;
  bottom: 1px; right: 2px;
  font-family: 'Press Start 2P', monospace;
  font-size: 6px;
  color: var(--gold);
  text-shadow: 1px 1px 0 #000;
  pointer-events: none;
  z-index: 5;
  line-height: 1;
}

.dice-empty {
  font-size: 10px; color: var(--border);
  font-family: 'Press Start 2P', monospace;
  letter-spacing: 2px; padding: 0 6px;
}



/* ── BOSS PANEL ── */
.boss-panel {
  width: 380px; flex-shrink: 0;
  display: flex; flex-direction: column;
  padding: 0;
}
.boss-panel .panel-inner {
  padding: 0;
  display: flex; flex-direction: row; flex: 1;
  overflow: hidden;
}

.boss-main {
  flex: 1;
  position: relative;
  background: var(--panel2);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 22px 16px;
  min-height: 260px;
}
.boss-main::after {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    to bottom, transparent, transparent 3px,
    rgba(0,0,0,0.10) 3px, rgba(0,0,0,0.10) 4px
  );
  pointer-events: none; z-index: 10;
}
.boss-name-el {
  font-family: 'Press Start 2P', monospace;
  font-size: 13px;
  color: var(--damage);
  text-shadow: 3px 3px 0 #000, 0 0 20px rgba(200,40,40,0.3);
  text-align: center;
  letter-spacing: 2px;
  line-height: 1.6;
  position: relative; z-index: 2;
}
.boss-crown {
  display: none;              /* показывается только для боссов */
  justify-content: center;
  position: relative; z-index: 2;
  margin-bottom: 2px;
  filter: drop-shadow(2px 2px 0 #000);
}
.boss-crown.show { display: flex; }
.boss-crown svg {
  width: 56px;
  height: 35px;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
.boss-loot-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  position: relative; z-index: 2;
}
.boss-loot-icon {
  width: 64px; height: 64px;
  image-rendering: pixelated;
  border: 2px solid var(--border-accent);
  box-shadow: 3px 3px 0 #000;
  background: var(--panel);
  padding: 6px;
  display: block;
}
.boss-loot-label {
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  color: var(--gold);
  text-align: center;
  letter-spacing: 1px;
  line-height: 1.7;
  text-shadow: 1px 1px 0 #000;
}
@keyframes lootPulse {
  0%,100% { box-shadow: 3px 3px 0 #000, 0 0 0px var(--gold-dim); }
  50%      { box-shadow: 3px 3px 0 #000, 0 0 14px var(--gold); }
}
.boss-loot-icon.dropped {
  animation: lootPulse 900ms steps(4) infinite;
  border-color: var(--gold);
}

/* ── HP BAR — right side, vertical ── */
.boss-hp-bar {
  width: 32px;
  flex-shrink: 0;
  background: #0d0508;
  border-left: 1px solid var(--border-accent);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* fill rises from bottom */
.boss-hp-fill {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: #8a1a1a;
  transition: height 220ms steps(10);
  z-index: 1;
}
/* colour states */
.boss-hp-fill.hp-high   { background: #2a7a2a; }   /* >60% — green */
.boss-hp-fill.hp-mid    { background: #8a6a18; }   /* 30–60% — yellow */
.boss-hp-fill.hp-low    { background: #8a2a18; }   /* 15–30% — orange-red */
.boss-hp-fill.hp-crit   { background: #c03030; }   /* <15% — bright red */

/* segment notches */
.boss-hp-bar::before {
  content: '';
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: repeating-linear-gradient(
    to top,
    transparent, transparent calc(10% - 1px),
    rgba(0,0,0,0.5) calc(10% - 1px), rgba(0,0,0,0.5) 10%
  );
}

/* HP text — vertical, centered over bar */
.boss-hp-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 3;
  pointer-events: none;
}
.boss-hp-text span {
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  color: rgba(255,255,255,0.85);
  text-shadow: 1px 1px 0 #000;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  transform: rotate(180deg);
  white-space: nowrap;
  letter-spacing: 1px;
}

/* floating damage — static, stays until boss dies */
.float-dmg {
  position: absolute; font-size: 13px;
  text-shadow: 2px 2px 0 #000, 0 0 8px rgba(0,0,0,0.8);
  pointer-events: none; z-index: 15;
  font-family: 'Press Start 2P', monospace;
  opacity: 0;
  animation: dmgAppear 120ms steps(3) forwards;
}
@keyframes dmgAppear {
  0%   { opacity: 0; transform: scale(0.5); }
  100% { opacity: 1; transform: scale(1); }
}

/* damage numbers layer — covers full boss panel */
#boss-dmg-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 15;
  overflow: hidden;
}

/* ── CORNER DECO ── */
.corner { position: absolute; width: 8px; height: 8px; border-color: var(--accent); border-style: solid; z-index: 20; }
.corner-tl { top: 0; left: 0; border-width: 2px 0 0 2px; }
.corner-tr { top: 0; right: 0; border-width: 2px 2px 0 0; }
.corner-bl { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
.corner-br { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

/* ════════════════════════════════════════
   GM PANEL - modal overlay
   ════════════════════════════════════════ */

/* ── K-TOOLBAR ── */
#k-toolbar {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #0e0e10;
  border-top: 2px solid var(--border-accent);
  box-shadow: 0 -4px 0 #000;
  z-index: 800;
  padding: 10px 20px 14px;
  flex-direction: column;
  gap: 8px;
  align-items: flex-start;
}
#k-toolbar.open { display: flex; }
#k-toolbar-label {
  font-family: 'Press Start 2P', monospace;
  font-size: 7px; color: var(--gold-dim);
  letter-spacing: 2px; text-transform: uppercase;
}
#k-toolbar-hint {
  font-family: 'Press Start 2P', monospace;
  font-size: 6px; color: #444;
  letter-spacing: 1px;
  margin-left: auto;
}
#k-toolbar-row {
  display: flex;
  flex-direction: row;
  gap: 12px;
  align-items: center;
}
.k-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: grab;
  user-select: none;
}
.k-item:active { cursor: grabbing; }
.k-item-icon {
  width: 48px; height: 48px;
  background: var(--panel2);
  border: 2px solid var(--border-accent);
  box-shadow: 3px 3px 0 #000;
  display: flex; align-items: center; justify-content: center;
  image-rendering: pixelated;
  position: relative;
  transition: border-color 100ms steps(2);
}
.k-item:hover .k-item-icon { border-color: var(--gold); }
.k-item-icon img { width: 36px; height: 36px; image-rendering: pixelated; }
.k-item-icon.damager {
  font-size: 22px;
  color: var(--damage);
  text-shadow: 2px 2px 0 #000;
  font-family: 'Press Start 2P', monospace;
}
.k-item-label {
  font-family: 'Press Start 2P', monospace;
  font-size: 6px; color: var(--text-dim);
  text-align: center; line-height: 1.5;
  max-width: 52px;
}
/* Ghost image while dragging */
.k-drag-ghost {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  opacity: 0.85;
  transform: translate(-50%, -50%);
}
.k-drag-ghost .k-item-icon {
  box-shadow: 0 0 12px var(--gold-dim);
  border-color: var(--gold);
}
/* Drop target highlight */
.drop-target-active {
  outline: 2px solid var(--gold) !important;
  outline-offset: 2px;
  filter: brightness(1.3);
}

/* Backdrop */
#gm-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.82);
  z-index: 600;
}
#gm-backdrop.open { display: block; }

/* GM modal — centered */
#gm-panel {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.95);
  width: 460px;
  max-height: 90vh;
  background: var(--panel);
  border: 2px solid var(--border-accent);
  box-shadow: 6px 6px 0 #000;
  z-index: 700;
  display: none;
  flex-direction: column;
  overflow: hidden;
  opacity: 0;
  transition: opacity 0.12s steps(4), transform 0.12s steps(4);
}
#gm-panel.open {
  display: flex;
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

.gm-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.gm-panel-title {
  font-family: 'Press Start 2P', monospace;
  font-size: 9px; color: var(--gold);
  letter-spacing: 2px; text-transform: uppercase;
}
.gm-esc-hint {
  font-family: 'Press Start 2P', monospace;
  font-size: 7px; color: var(--text-dim);
  letter-spacing: 1px;
}
#gm-close {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  width: 26px; height: 26px;
  cursor: pointer; line-height: 1;
}
#gm-close:hover { color: var(--damage); border-color: var(--damage-dim); background: #1a0808; }

.gm-body {
  overflow-y: auto;
  flex: 1;
  padding: 0;
}

.gm-section {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--border);
}
.gm-section-label {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px; color: var(--gold-dim);
  letter-spacing: 1px; text-transform: uppercase;
  margin-bottom: 10px;
}

/* Add form */
.gm-add-form { display: flex; gap: 6px; }
.gm-add-form input {
  flex: 1; background: var(--panel2);
  border: 1px solid var(--border-accent);
  border-bottom: 2px solid var(--accent);
  padding: 7px 10px; color: var(--gold); font-size: 12px;
  outline: none; font-family: 'CGCHR', monospace; letter-spacing: 0.5px;
}
.gm-add-form input::placeholder { color: var(--text-dim); }
.gm-add-form input:focus { border-color: var(--accent-b); background: #0a0a10; }
.gm-add-form button {
  background: var(--panel2); color: var(--gold);
  border: 1px solid var(--border-accent);
  border-bottom: 2px solid var(--accent);
  padding: 0 14px; font-size: 7px; cursor: pointer;
  font-family: 'Press Start 2P', monospace;
  text-transform: uppercase; letter-spacing: 1px; white-space: nowrap;
}
.gm-add-form button:hover { background: #141410; border-color: var(--accent-b); color: #fff; }

.btn-gm {
  background: transparent;
  border: 1px solid var(--border-accent);
  color: var(--gold-dim);
  padding: 10px 18px; font-size: 7px; cursor: pointer;
  font-family: 'Press Start 2P', monospace;
  text-transform: uppercase; letter-spacing: 1px; white-space: nowrap;
  width: 100%; text-align: left;
  display: flex; align-items: center; gap: 10px;
}
.btn-gm:hover { background: #141410; color: var(--gold); border-color: var(--accent-b); }
.btn-gm .btn-arrow { margin-left: auto; color: var(--border-accent); }
.btn-gm:hover .btn-arrow { color: var(--gold); }

.btn-gm-danger {
  background: transparent;
  border: 1px solid var(--damage-dim);
  color: var(--damage-dim);
  padding: 7px 14px; font-size: 7px; cursor: pointer;
  font-family: 'Press Start 2P', monospace;
  text-transform: uppercase; letter-spacing: 1px;
}
.btn-gm-danger:hover { background: #1a0808; color: var(--damage); border-color: var(--damage); }

/* Log */
.gm-log-body {
  max-height: 260px; overflow-y: auto;
  padding: 8px 16px 10px;
}
.log-entry {
  font-size: 12px; padding: 4px 0;
  color: #a8a898; border-bottom: 1px solid var(--border);
  font-family: 'CGCHR', monospace; line-height: 1.5;
  display: flex; align-items: baseline; gap: 6px;
}
.log-entry:first-child { color: var(--text); }
.log-entry:last-child  { border-bottom: none; }
.log-entry .dmg { color: var(--damage); font-family: 'Press Start 2P', monospace; font-size: 10px; }
.log-bullet { color: var(--border-accent); flex-shrink: 0; font-size: 10px; }
.log-day-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin: 10px 0 4px;
  font-family: 'Press Start 2P', monospace; font-size: 7px;
  letter-spacing: 2px; color: var(--gold-dim); text-transform: uppercase;
  border-bottom: 1px solid var(--border-accent); padding-bottom: 5px;
}
.log-day-header:first-child { margin-top: 0; }
.log-day-header .log-day-count { color: var(--text-dim); letter-spacing: 1px; }
.log-day-header.is-today { color: var(--gold); }
.log-time {
  color: var(--text-dim); font-size: 10px; flex-shrink: 0;
  font-family: 'CGCHR', monospace;
}
.log-entry .src-forum { color: var(--accent-b); }

/* Boss config subpanel */
#boss-config-panel {
  display: none;
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 480px;
  max-height: 85vh;
  background: var(--panel);
  border: 2px solid var(--border-accent);
  box-shadow: 6px 6px 0 #000;
  z-index: 710;
  flex-direction: column;
  overflow: hidden;
}
#encounter-cfg-body {
  overflow-y: auto;
  flex: 1;
}
#boss-config-panel.open { display: flex; }
.boss-cfg-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px 10px; border-bottom: 1px solid var(--border);
}
.boss-cfg-title {
  font-family: 'Press Start 2P', monospace; font-size: 9px;
  color: var(--gold); letter-spacing: 2px;
}
.boss-cfg-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.boss-cfg-row { display: flex; flex-direction: column; gap: 6px; }
.boss-cfg-label {
  font-family: 'Press Start 2P', monospace; font-size: 7px;
  color: var(--gold-dim); letter-spacing: 1px; text-transform: uppercase;
}
.boss-cfg-input {
  background: var(--panel2); border: 1px solid var(--border-accent);
  border-bottom: 2px solid var(--accent); color: var(--gold);
  font-family: 'CGCHR', monospace; font-size: 13px;
  padding: 7px 10px; outline: none; width: 100%;
}
.boss-cfg-input:focus { border-color: var(--accent-b); background: #0a0a10; }
.boss-cfg-hp-row { display: flex; gap: 8px; align-items: center; }
.boss-cfg-hp-row input { flex: 1; }
.boss-cfg-sep {
  font-family: 'Press Start 2P', monospace; font-size: 8px;
  color: var(--text-dim);
}
.boss-cfg-loot-list {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px;
}
.loot-option {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 6px 8px; border: 2px solid var(--border);
  cursor: pointer; background: var(--panel2); min-width: 56px;
}
.loot-option:hover, .loot-option.selected {
  border-color: var(--gold); background: #141410;
}
.loot-option img {
  width: 36px; height: 36px; image-rendering: pixelated;
}
.loot-option span {
  font-family: 'Press Start 2P', monospace; font-size: 6px;
  color: var(--text-dim); text-align: center; line-height: 1.5;
}
.loot-option.selected span { color: var(--gold); }
.boss-cfg-apply {
  background: var(--gold-dim); color: #000;
  border: 2px solid var(--gold); padding: 10px;
  font-family: 'Press Start 2P', monospace; font-size: 8px;
  letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
  width: 100%; margin-top: 4px;
}
.boss-cfg-apply:hover { background: var(--gold); }

/* ── ENCOUNTER QUEUE ── */
.boss-queue-entry {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  background: var(--panel2);
  border: 1px solid var(--border);
  margin-bottom: 4px;
  position: relative;
}
.boss-queue-entry.current-enemy {
  border-color: var(--damage);
  background: #180808;
}
.boss-queue-entry.current-enemy .bqe-type { color: var(--damage); }
.bqe-icon { font-size: 14px; flex-shrink: 0; }
.bqe-info { flex: 1; min-width: 0; }
.bqe-name {
  font-family: 'Press Start 2P', monospace;
  font-size: 7px; color: var(--gold);
  letter-spacing: 1px; line-height: 1.8;
}
.bqe-type {
  font-family: 'Press Start 2P', monospace;
  font-size: 6px; color: var(--text-dim); letter-spacing: 1px;
}
.bqe-loot {
  display: flex; gap: 4px; margin-top: 3px;
}
.bqe-loot-icon {
  width: 20px; height: 20px;
  image-rendering: pixelated;
  border: 1px solid var(--border-accent);
  background: var(--panel);
  padding: 2px;
}
.bqe-del {
  background: transparent; border: 1px solid var(--damage-dim);
  color: var(--damage-dim); font-size: 10px;
  width: 22px; height: 22px; cursor: pointer; flex-shrink: 0;
  font-family: 'Press Start 2P', monospace; line-height: 1;
}
.bqe-del:hover { border-color: var(--damage); color: var(--damage); background: #1a0808; }
.bqe-edit {
  background: transparent; border: 1px solid var(--border-accent);
  color: var(--gold-dim); font-size: 10px; margin-right: 4px;
  width: 22px; height: 22px; cursor: pointer; flex-shrink: 0;
  font-family: 'Press Start 2P', monospace; line-height: 1;
}
.bqe-edit:hover { border-color: var(--accent-b); color: var(--gold); background: #14110a; }
.bqe-mob-spacer {
  padding: 2px 8px 2px 28px;
  margin-bottom: 4px;
}
.bqe-mob-tag {
  font-family: 'Press Start 2P', monospace;
  font-size: 6px; color: #3a3a4a;
  letter-spacing: 1px;
}

/* Log subpanel */
#log-panel {
  display: none;
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 500px; max-height: 80vh;
  background: var(--panel);
  border: 2px solid var(--border-accent);
  box-shadow: 6px 6px 0 #000;
  z-index: 710;
  flex-direction: column;
  overflow: hidden;
}
#log-panel.open { display: flex; }
.log-panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px 10px; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.log-panel-title {
  font-family: 'Press Start 2P', monospace; font-size: 9px;
  color: var(--gold); letter-spacing: 2px;
}
#log-panel .gm-log-body { max-height: none; flex: 1; overflow-y: auto; }


/* ── AUTOBATTLE BAR ── */
.auto-bar { display:flex; justify-content:center; align-items:center; gap:8px; margin:-6px 0 14px; }
.auto-btn {
  font-family:'Press Start 2P', monospace; font-size:8px; letter-spacing:1px;
  padding:8px 12px; background:var(--panel); color:var(--gold-dim);
  border:2px solid var(--border-accent); box-shadow:3px 3px 0 #000; cursor:pointer;
}
.auto-btn:hover { color:var(--gold); border-color:var(--accent-b); }
.auto-btn.active { color:#000; background:var(--gold); border-color:var(--gold); }
.auto-sep { width:1px; height:24px; background:var(--border); margin:0 4px; }
</style>

// ── K-TOOLBAR ──
const kToolbar = document.getElementById("k-toolbar");

function toggleKToolbar() {
  if (kToolbar.classList.contains("open")) {
    kToolbar.classList.remove("open");
  } else {
    buildKToolbar();

function buildKToolbar() {
  const row = document.getElementById("k-toolbar-row");
  row.innerHTML = "";

  // 1. Damager item (skull — deals 25 HP to target player)
  const damagerEl = makeKItem({
    id: "__damager__",
    name: "Урон\n−25 HP",
    isDamager: true
  });
  row.appendChild(damagerEl);

  // Divider
  const div = document.createElement("div");
  div.style.cssText = "width:1px;height:48px;background:var(--border);margin:0 4px;flex-shrink:0;";
  row.appendChild(div);

  // 2. All available loot items
  LOOT_ITEMS.forEach(item => {
    row.appendChild(makeKItem(item));
  });
}

function makeKItem(item) {
  const wrap = document.createElement("div");
  wrap.className = "k-item";
  wrap.draggable = true;
  wrap.dataset.itemId = item.id;

  const icon = document.createElement("div");
  icon.className = "k-item-icon" + (item.isDamager ? " damager" : "");

  if (item.isDamager) {
    icon.textContent = "💀";
  } else {
    const img = document.createElement("img");
    img.src = item.src;
    // Remove white bg
    removeWhiteBackground(item.src, src => { img.src = src; });
    icon.appendChild(img);
  }

  const label = document.createElement("div");
  label.className = "k-item-label";
  label.innerHTML = item.name.replace(" ", "<br>");

  wrap.appendChild(icon);
  wrap.appendChild(label);

  // ── Drag logic ──
  let ghost = null;

  wrap.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    e.preventDefault();

    // Create ghost
    ghost = document.createElement("div");
    ghost.className = "k-drag-ghost";
    ghost.innerHTML = icon.outerHTML;
    ghost.style.left = e.clientX + "px";
    ghost.style.top  = e.clientY + "px";
    document.body.appendChild(ghost);

    const onMove = ev => {
      ghost.style.left = ev.clientX + "px";
      ghost.style.top  = ev.clientY + "px";

      // Highlight drop target
      document.querySelectorAll(".drop-target-active").forEach(x => x.classList.remove("drop-target-active"));
      const target = getParticipantUnder(ev.clientX, ev.clientY);
      if (target) target.el.classList.add("drop-target-active");
    };

    const onUp = ev => {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      ghost.remove(); ghost = null;
      document.querySelectorAll(".drop-target-active").forEach(x => x.classList.remove("drop-target-active"));

      const target = getParticipantUnder(ev.clientX, ev.clientY);
      if (target) applyKItem(item, target.participant);
    };

    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });

  return wrap;
}

// Find which participant card the mouse is over
function getParticipantUnder(x, y) {
  const els = document.querySelectorAll(".avatar-card");
  for (const el of els) {
    const r = el.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
      const tr = el.closest("tr[data-participant-id]");
      if (!tr) continue;
      const id = parseInt(tr.dataset.participantId);
      const participant = participants.find(p => p.id === id);
      if (participant) return { el, participant };
    }
  }
  return null;
}

function applyKItem(item, participant, date) {
  if (item.isDamager) {
    setPlayerHP(participant.id, (participant.hp ?? 100) - 25);
    addLogEntry(`💀 ${participant.name} получил 25 урона. HP: ${participant.hp}`, date);
  } else {
    giveItemToParticipant(participant, item);
    addLogEntry(`🎁 ${participant.name} получил: ${item.name}`, date);
  }
}

// ── MOB DEFINITIONS ──
const MOB_DEFS = [
  {
    id: "leprechaun",
    name: "ЛЕПРИКОН",
    icon: "🍀",
    color: "#3fae6a",   // зелёный — клевер
    lootCycle: ["leprechaun_sword", "doubloon"],
    _lootIdx: 0,
  },
  {
    id: "goblin",
    name: "ГОБЛИН",
    icon: "💣",
    color: "#d9793d",   // рыже-оранжевый — взрывчатка
    lootCycle: ["dagger", "goblin_bomb"],
    _lootIdx: 0,
  },
  {
    id: "scarecrow",
    name: "ЧУЧЕЛО",
    icon: "🌾",
    color: "#c9a227",   // соломенно-жёлтый
    lootCycle: ["hay", "pitchfork"],
    _lootIdx: 0,
  },
];

// Returns current loot id for mob and advances cycle
function nextMobLoot(mobDef) {
  const id = mobDef.lootCycle[mobDef._lootIdx % mobDef.lootCycle.length];
  mobDef._lootIdx++;
  return id;
}

// Показывает пиксельную корону над именем — только для боссов, не для мобов
function setBossCrown(isBoss) {
  const crown = document.getElementById("boss-crown");
  if (crown) crown.classList.toggle("show", !!isBoss);
}

// Calculate mob HP based on participants
function calcMobHP() {
  let base = Math.ceil(participants.length / 2) * 8; // база считается по половине состава
  let lvlBonus = 0;
  participants.forEach(p => {
    lvlBonus += (p.level || 1) * (20 + Math.floor(Math.random() * 11)); // +20..30 per level
  });
  return Math.max(40, base + lvlBonus);
}

// ── BOSS QUEUE ──
// Each entry: { type: "boss", name, loot: [id, id] }
// Mobs are generated on-the-fly before each boss
let bossQueue = []; // array of boss entries
let encounterQueue = []; // flattened: [...mobs, boss, ...mobs, boss, ...]
let encounterIdx = 0;  // current position
let _lastMobId = null; // track last mob to avoid repeat

// Build mobs for one wave (3 mobs, no two identical in a row)
function buildMobWave() {
  const mobs = [];
  let last = _lastMobId;
  const pool = MOB_DEFS.map(m => m.id);
  for (let i = 0; i < 3; i++) {
    let candidates = pool.filter(id => id !== last);
    const id = candidates[Math.floor(Math.random() * candidates.length)];
    mobs.push({ type: "mob", mobId: id });
    last = id;
  }
  _lastMobId = last;
  return mobs;
}

// Append boss (+ its 3-mob wave) to the END of the queue — progress is never reset
let _bossUid = 1;
let enemyHits = 0, currentEnemyRetaliates = false, currentEnemyDrains = false, enemyRoundsDone = 0; // умения босса
let currentDrainThreshold = 1; // высасывание активно, пока HP босса <= этой доли от максимума (1 = всегда)
let lastMobHP = 200; // HP последнего моба — от него считается HP босса
let currentEnemyId = null; // id моба на экране (null = ещё не заспавнен/босс)
let currentLootIds = []; // loot of the enemy currently on screen
let spawnTimer = null;
let editingBossUid = null; // uid of boss being edited (null = adding new)
let autoOn = false, autoSpeed = 1, autoTimer = null;
let battleStarted = false; // до первого удара враг не заспавнен, на экране плашка «СТАРТ»

function enqueueBoss(boss) {
  boss.uid = _bossUid++;
  bossQueue.push(boss);
  buildMobWave().forEach(m => encounterQueue.push({ ...m, bossUid: boss.uid }));
  encounterQueue.push({ type: "boss", name: boss.name, loot: boss.loot, bossUid: boss.uid, retaliate: !!boss.retaliate, drain: !!boss.drain, drainThreshold: boss.drainThreshold ?? 1, qty: boss.qty || {} });
}
// Remove boss and its NOT-yet-spawned entries only (already passed entries stay put)
function dequeueBoss(uid) {
  bossQueue = bossQueue.filter(b => b.uid !== uid);
  encounterQueue = encounterQueue.filter((e, i) => i < encounterIdx || e.bossUid !== uid);
}

// Spawn next enemy from the queue
function spawnNext() {
  if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
  if (encounterQueue.length === 0) { addLogEntry("⚠ Очередь пуста — добавьте боссов"); return false; }
  if (encounterIdx >= encounterQueue.length) { addLogEntry("✓ Все бои завершены!"); return false; }
  spawnEncounterEntry(encounterQueue[encounterIdx++]);
  return true;
}
// Called when an enemy dies: next one appears automatically
function scheduleNextSpawn() {
  if (spawnTimer) return;
  spawnTimer = setTimeout(spawnNext, Math.max(500, 1500 / autoSpeed));
}

// ── SPAWN CURRENT ENCOUNTER ENTRY ──
function spawnEncounterEntry(entry) {
  if (entry.type === "mob") {
    const mobDef = MOB_DEFS.find(m => m.id === entry.mobId);
    if (!mobDef) return;
    const lootId = nextMobLoot(mobDef);
    const loot   = LOOT_ITEMS.find(i => i.id === lootId);
    const hp     = calcMobHP();
    currentLootIds = [lootId];
    currentEnemyId = mobDef.id;
    currentEnemyRetaliates = false; currentEnemyDrains = false; enemyHits = 0;

    MAX_HP    = hp;
    currentHP = hp;
    lastMobHP = hp;
    updateHP();
    clearBossDamageNumbers();

    const nameEl  = document.getElementById("boss-name-el");
    const lootIcon  = document.getElementById("boss-loot-icon");
    const lootLabel = document.getElementById("boss-loot-label");
    const lootWrap  = document.getElementById("boss-loot-wrap");
    if (lootWrap) lootWrap.style.display = "";

    if (nameEl) {
      nameEl.textContent = mobDef.name;
      nameEl.style.color = mobDef.color || "";
    }
    setBossCrown(false);

    // Mob has 1 loot slot — hide second if any
    if (lootWrap) {
      // remove extra loot icons if they were added
      const extras = lootWrap.querySelectorAll(".boss-loot-icon.slot2");
      extras.forEach(e => e.remove());
      const extras2 = lootWrap.querySelectorAll(".boss-loot-label.slot2");
      extras2.forEach(e => e.remove());
    }

    if (loot && lootIcon) {
      removeWhiteBackground(loot.src, src => { lootIcon.src = src; });
    }
    if (loot && lootLabel) {
      lootLabel.innerHTML = loot.name.replace(" ", "<br>");
    }

    // Reset per-boss damage
    participants.forEach(p => p.damageCurrent = 0);

    addLogEntry(`👾 МОБ: ${mobDef.name} | HP: ${hp} | Лут: ${loot ? loot.name : "—"}`);
  } else {
    // Boss
    const loot1 = LOOT_ITEMS.find(i => i.id === entry.loot[0]);
    const loot2 = entry.loot[1] ? LOOT_ITEMS.find(i => i.id === entry.loot[1]) : null;
    const qtyOf = id => ((entry.qty || {})[id]) || 1;
    currentLootIds = entry.loot.flatMap(id => Array(qtyOf(id)).fill(id)); // 2 кости = два розыгрыша
    currentEnemyId = null;
    enemyHits = 0; currentEnemyRetaliates = !!entry.retaliate; currentEnemyDrains = !!entry.drain;
    currentDrainThreshold = entry.drainThreshold ?? 1;
    enemyRoundsDone = 0; participants.forEach(p => { p.bossHits = 0; p.hitsTotal = 0; });
    // Череп: с этого босса действует (по одному черепу на босса)
    participants.forEach(p => { if (participantItemCount(p, "skull") > 0) p.skullActive = true; });

    MAX_HP    = Math.max(100, Math.round(lastMobHP * 2 / 100) * 100); // HP последнего моба ×2, округл. до сотен
    currentHP = MAX_HP;
    updateHP();
    clearBossDamageNumbers();

    const nameEl    = document.getElementById("boss-name-el");
    const lootIcon  = document.getElementById("boss-loot-icon");
    const lootLabel = document.getElementById("boss-loot-label");
    const lootWrap  = document.getElementById("boss-loot-wrap");
    if (lootWrap) lootWrap.style.display = "";

    if (nameEl) {
      nameEl.textContent = entry.name;
      nameEl.style.color = "";   // цвет босса не трогаем — берём дефолтный из CSS
    }
    setBossCrown(true);

    if (loot1 && lootIcon) {
      removeWhiteBackground(loot1.src, src => { lootIcon.src = src; });
    }
    if (loot1 && lootLabel) {
      lootLabel.innerHTML = (loot1.name + (qtyOf(loot1.id) > 1 ? " ×" + qtyOf(loot1.id) : "")).replace(" ", "<br>");
    }

    // Second loot slot for boss
    if (lootWrap) {
      let icon2 = lootWrap.querySelector(".boss-loot-icon.slot2");
      let label2 = lootWrap.querySelector(".boss-loot-label.slot2");
      if (loot2) {
        if (!icon2) {
          icon2 = document.createElement("img");
          icon2.className = "boss-loot-icon slot2";
          icon2.style.marginTop = "6px";
          lootWrap.appendChild(icon2);
        }
        if (!label2) {
          label2 = document.createElement("div");
          label2.className = "boss-loot-label slot2";
          lootWrap.appendChild(label2);
        }
        removeWhiteBackground(loot2.src, src => { icon2.src = src; });
        label2.innerHTML = (loot2.name + (qtyOf(loot2.id) > 1 ? " ×" + qtyOf(loot2.id) : "")).replace(" ", "<br>");
      } else {
        if (icon2)  icon2.remove();
        if (label2) label2.remove();
      }
    }

    participants.forEach(p => p.damageCurrent = 0);
    addLogEntry(`☠ БОСС: ${entry.name} | HP: ${MAX_HP} | Лут: ${loot1 ? loot1.name : "—"}${loot2 ? " + " + loot2.name : ""}`);
  }

  updateQueuePreview();
}

// ── QUEUE PREVIEW (next to spawn button) ──
function updateQueuePreview() {
  const el = document.getElementById("next-encounter-preview");
  if (!el) return;
  if (encounterQueue.length === 0) {
    el.textContent = "Очередь пуста — добавьте боссов";
    return;
  }
  const next = encounterQueue[encounterIdx];
  if (!next) {
    el.textContent = "▸ Все бои завершены";
    return;
  }
  if (next.type === "mob") {
    const mobDef = MOB_DEFS.find(m => m.id === next.mobId);
    el.textContent = `▸ Следующий: ${mobDef ? mobDef.name : "МОБ"}`;
  } else {
    el.textContent = `▸ Следующий: ☠ БОСС — ${next.name}`;
  }
}

// ── BOSS QUEUE UI ──
function renderBossQueue() {
  const list = document.getElementById("boss-queue-list");
  if (!list) return;
  list.innerHTML = "";

  if (bossQueue.length === 0) {
    const empty = document.createElement("div");
    empty.style.cssText = "font-family:'Press Start 2P',monospace;font-size:7px;color:var(--text-dim);padding:8px 0;";
    empty.textContent = "Боссов нет — добавьте первого";
    list.appendChild(empty);
    return;
  }

  bossQueue.forEach((boss, idx) => {
    // Mob wave spacer
    const spacer = document.createElement("div");
    spacer.className = "bqe-mob-spacer";
    const mobNames = ["Моб", "Моб", "Моб"];
    spacer.innerHTML = `<span class="bqe-mob-tag">📦 3 МОБА → </span>`;
    list.appendChild(spacer);

    // Boss entry
    const entry = document.createElement("div");
    entry.className = "boss-queue-entry";

    const icon = document.createElement("span");
    icon.className = "bqe-icon";
    icon.textContent = "☠";

    const info = document.createElement("div");
    info.className = "bqe-info";
    const nameDiv = document.createElement("div");
    nameDiv.className = "bqe-name";
    nameDiv.textContent = boss.name;
    const typeDiv = document.createElement("div");
    typeDiv.className = "bqe-type";
    typeDiv.textContent = "БОСС";

    const lootRow = document.createElement("div");
    lootRow.className = "bqe-loot";
    boss.loot.filter(Boolean).forEach(lootId => {
      const loot = LOOT_ITEMS.find(i => i.id === lootId);
      if (!loot) return;
      const img = document.createElement("img");
      img.className = "bqe-loot-icon";
      img.title = loot.name;
      removeWhiteBackground(loot.src, src => { img.src = src; });
      lootRow.appendChild(img);
    });

    info.appendChild(nameDiv);
    info.appendChild(typeDiv);
    info.appendChild(lootRow);

    const del = document.createElement("button");
    del.className = "bqe-del";
    del.textContent = "×";
    del.title = "Удалить из очереди";
    del.addEventListener("click", () => {
      dequeueBoss(boss.uid);
      renderBossQueue();
      updateQueuePreview();
    });

    const edit = document.createElement("button");
    edit.className = "bqe-edit";
    edit.textContent = "✎";
    edit.title = "Редактировать босса";
    edit.addEventListener("click", () => {
      editingBossUid = boss.uid;
      selectedLoot1 = boss.loot[0] || LOOT_ITEMS[0].id;
      selectedLoot2 = boss.loot[1] || null;
      buildLootSelector("loot-options-1", selectedLoot1, id => { selectedLoot1 = id; });
      buildLootSelector("loot-options-2", selectedLoot2, id => { selectedLoot2 = id; });
      document.getElementById("cfg-boss-name").value = boss.name;
      document.getElementById("boss-cfg-apply").textContent = "✔ Сохранить";
      document.getElementById("add-boss-form").style.display = "";
      document.getElementById("add-boss-btn").style.display = "none";
    });

    entry.appendChild(icon);
    entry.appendChild(info);
    entry.appendChild(edit);
    entry.appendChild(del);
    list.appendChild(entry);
  });
}

let selectedLoot1 = "leprechaun_sword";
let selectedLoot2 = null;

function buildLootSelector(containerId, currentSelected, onSelect) {
  const list = document.getElementById(containerId);
  if (!list) return;
  list.innerHTML = "";
  LOOT_ITEMS.filter(i => i.boss).forEach(item => {
    const el = document.createElement("div");
    el.className = "loot-option" + (item.id === currentSelected ? " selected" : "");
    el.innerHTML = `<img src="${item.src}"><span>${item.name.replace(" ", "<br>")}</span>`;
    el.addEventListener("click", () => {
      list.querySelectorAll(".loot-option").forEach(x => x.classList.remove("selected"));

      onSelect(item.id);
    });
    removeWhiteBackground(item.src, src => { el.querySelector("img").src = src; });

  });
}

  document.getElementById("add-boss-btn").style.display = "";
});

document.getElementById("boss-cfg-apply").addEventListener("click", () => {
  const nameVal = document.getElementById("cfg-boss-name").value.trim().toUpperCase();
  if (!nameVal) { alert("Введите имя босса"); return; }
  if (!selectedLoot1 || !selectedLoot2) { alert("У босса должно быть 2 предмета лута"); return; }
  const lootArr = [selectedLoot1, selectedLoot2].filter(Boolean);
  const editing = editingBossUid !== null ? bossQueue.find(b => b.uid === editingBossUid) : null;
  if (editing) {
    editing.name = nameVal;
    editing.loot = lootArr;
    editing.qty = Object.fromEntries(Object.entries(editing.qty || {}).filter(([k]) => lootArr.includes(k)));
    // обновить ещё не появившегося босса в очереди боёв
    encounterQueue.forEach((e, i) => {
      if (i >= encounterIdx && e.type === "boss" && e.bossUid === editing.uid) {
        e.name = nameVal; e.loot = lootArr.slice(); e.qty = editing.qty || {};
      }
    });
    editingBossUid = null;
    renderBossQueue();
    updateQueuePreview();
    document.getElementById("add-boss-form").style.display = "none";
    document.getElementById("add-boss-btn").style.display = "";
    addLogEntry(`✎ Босс «${nameVal}» изменён`);
    return;
  }
  enqueueBoss({ name: nameVal, loot: lootArr });
  renderBossQueue();
  updateQueuePreview();
  document.getElementById("add-boss-form").style.display = "none";
  document.getElementById("add-boss-btn").style.display = "";
  addLogEntry(`⚙ Босс «${nameVal}» добавлен в очередь`);
  // враг уже мёртв и ждал новой очереди — продолжаем автоматически
  if (currentHP <= 0) scheduleNextSpawn();
});

// Manual spawn — only needed to START the first fight; later enemies spawn automatically
document.getElementById("spawn-next-btn").addEventListener("click", () => {
  if (currentHP > 0 && encounterIdx > 0) {
    addLogEntry("⚠ Текущий враг ещё жив — следующий появится сам");
    return;
  }
  if (spawnNext()) closeBossCfg();
});
