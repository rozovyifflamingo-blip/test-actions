name: Тест ScrapingAnt (ручной)

# Отдельный workflow для быстрой проверки: только ручной запуск, ничего не
# коммитит и не трогает state.json/actions.json. Нужен секрет
# SCRAPINGANT_API_KEY (Settings -> Secrets and variables -> Actions).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "single = один запрос по параметрам ниже; compare = 3 варианта подряд (тратит 3 запроса)"
        type: choice
        default: compare
        options:
          - compare
          - single
      url:
        description: "Какую страницу форума загрузить"
        required: false
        default: "https://antio.ru/index.php?showtopic=85048&st=0"
      proxy_type:
        description: "Тип прокси ScrapingAnt (residential расходует кредитов сильно больше)"
        type: choice
        default: datacenter
        options:
          - datacenter
          - residential
      proxy_country:
        description: "Страна выходного IP (двухбуквенный код)"
        required: false
        default: "RU"
      browser:
        description: "single: рендерить страницу браузером"
        type: boolean
        default: true
      return_page_source:
        description: "single: вернуть исходный HTML, а не DOM после JS"
        type: boolean
        default: true
      wait_for_selector:
        description: "single: CSS-селектор, которого ждать перед отдачей (например div.post_block)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  scrapingant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Python и зависимостей
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - name: Запросы через ScrapingAnt
        env:
          SA_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          IN_MODE: ${{ github.event.inputs.mode }}
          IN_URL: ${{ github.event.inputs.url }}
          IN_PROXY_TYPE: ${{ github.event.inputs.proxy_type }}
          IN_COUNTRY: ${{ github.event.inputs.proxy_country }}
          IN_BROWSER: ${{ github.event.inputs.browser }}
          IN_SOURCE: ${{ github.event.inputs.return_page_source }}
          IN_WAIT: ${{ github.event.inputs.wait_for_selector }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "::error::Не задан секрет SCRAPINGANT_API_KEY"
            exit 1
          fi

          # call <имя> <browser> <return_page_source> <wait_for_selector>
          call() {
            local name="$1" br="$2" src="$3" wait="$4"
            local args=(-sS -G -o "sa_$name.html" --max-time 150
              -H "x-api-key: $SA_KEY"
              --data-urlencode "url=$IN_URL"
              --data-urlencode "proxy_type=$IN_PROXY_TYPE"
              --data-urlencode "proxy_country=$IN_COUNTRY"
              --data-urlencode "browser=$br"
              --data-urlencode "return_page_source=$src")
            [ -n "$wait" ] && args+=(--data-urlencode "wait_for_selector=$wait")
            echo
            echo "################ вариант «$name»: browser=$br, return_page_source=$src, wait_for_selector='$wait', proxy=$IN_PROXY_TYPE/$IN_COUNTRY"
            local res
            res=$(curl "${args[@]}" -w "%{http_code} | %{size_download} байт | %{time_total} с" \
                  "https://api.scrapingant.com/v2/general" 2>&1) || true
            echo "curl: $res"
            local f="sa_$name.html"
            echo "  <title>:            $(grep -a -o -i '<title>[^<]*' "$f" | head -1)"
            echo "  есть <body:         $(grep -a -c -i '<body' "$f") строк"
            echo "  есть </body>:       $(grep -a -c -i '</body>' "$f") строк"
            echo "  post_block:         $(grep -a -o 'post_block' "$f" | wc -l) вхождений"
            echo "  Cloudflare-заглушка: $(grep -a -c -iE 'just a moment|один момент' "$f") строк"
            echo "  конец ответа:       $(tail -c 160 "$f" | tr -d '\r\n' )"
          }

          if [ "$IN_MODE" = "single" ]; then
            call single "$IN_BROWSER" "$IN_SOURCE" "$IN_WAIT"
          else
            call A_browser_source   true  true  ""
            call B_no_browser       false false ""
            call C_wait_post_block  true  false "div.post_block"
          fi

      - name: Разбор ответов парсером скрапера (parse_page)
        run: |
          python - <<'EOF'
          import glob
          import scrape_topic as s
          for f in sorted(glob.glob("sa_*.html")):
              html = open(f, encoding="utf-8", errors="replace").read()
              title, posts = s.parse_page(html)
              print(f"=== {f}: {len(html)} байт | заголовок: {title[:50]!r} | постов: {len(posts)}")
              for p in posts[:2] + posts[-1:]:
                  print(f"    #{p['post_id']} | {p['author']} | {p['timestamp']} | {p['text'][:60]!r}")
              if not posts:
                  print("    ПОСТОВ НЕТ (заглушка защиты, обрезанный ответ или другая разметка)")
          EOF
