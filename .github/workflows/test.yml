name: Stream Recorder

on:
  repository_dispatch:
    types: [start-record]
  workflow_dispatch:
    inputs:
      url:
        description: 'Ссылка на видео/стрим'
        required: true
        default: 'https://www.youtube.com/watch?v=aqz-KE-bpKQ'
      id:
        description: 'ID видео'
        required: true
        default: 'test_video'

jobs:
  record-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Установка софта (yt-dlp, ffmpeg, rclone, xray)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg curl unzip
          
          # 1. Установка yt-dlp
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          
          # 2. Установка rclone
          sudo -v ; curl https://rclone.org/install.sh | sudo bash
          
          # 3. Скачиваем Xray со всеми базами данных
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          sudo unzip -o xray.zip -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/xray

      - name: Запуск Xray VPN
        env:
          CONFIG_DATA: ${{ secrets.XRAY_CONFIG }}
        run: |
          printf "%s\n" "$CONFIG_DATA" > config.json
          xray run -c config.json &
          sleep 4
          
          echo "Проверяем IP через VPN:"
          curl --socks5 127.0.0.1:10808 https://api.ipify.org
          echo ""

      - name: Запись стрима / скачивание
        run: |
          TARGET_URL="${{ github.event.client_payload.url || github.event.inputs.url }}"
          TARGET_ID="${{ github.event.client_payload.id || github.event.inputs.id }}"
          
          echo "Качаем видео через наш VPN: $TARGET_URL"
          
          # Берем лучший звук и лучшее видео и сохраняем в MP4
          yt-dlp \
            --proxy "socks5://127.0.0.1:10808" \
            --js-runtimes node \
            --no-part \
            --merge-output-format mp4 \
            -o "stream_${TARGET_ID}.%(ext)s" \
            "$TARGET_URL"

      - name: Настройка Rclone для Google Диска
        if: always()
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.config/rclone
          printf "%s\n" "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf

      - name: Отправка на Google Диск
        if: always()
        run: |
          rclone copy ./ gdrive:YouTube_Records/ --include "stream_*.mp4" --include "stream_*.mkv" -v
