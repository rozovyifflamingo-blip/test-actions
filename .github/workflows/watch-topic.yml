name: Слежение за темой AntiO
on:
  schedule:
    - cron: "*/5 * * * *"      # каждые 5 минут (GitHub может задерживать на пару минут)
  workflow_dispatch:
    inputs:
      topic_id:
        description: "ID темы (showtopic=...)"
        required: false
        default: ""   # ID темы стёрт — впишите новый перед запуском

permissions:
  contents: write               # нужно, чтобы бот коммитил файлы обратно

concurrency:
  group: antio-watch
  cancel-in-progress: false     # не обрывать запуск на середине

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка Python-зависимостей
        run: pip install requests beautifulsoup4

      - name: Проверка темы форума
        env:
          TOPIC_ID: ${{ github.event.inputs.topic_id }}   # ID темы стёрт — впишите новый перед запуском
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python scrape_topic.py

      # -- Решаем, есть ли реальные изменения -- от этого зависит,
      #    запускать ли тяжёлый шаг со скриншотом
      - name: Проверить наличие изменений
        id: diff
        run: |
          # git diff не видит НОВЫЕ (untracked) файлы — а на первом запуске
          # actions.json/state.json/topic.html как раз такие. Поэтому смотрим
          # через git status, которая видит и новые, и изменённые файлы.
          if [ -z "$(git status --porcelain -- actions.json state.json topic.html)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Изменений нет — скриншот не нужен."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Есть новые события — будет сделан скриншот."
          fi

      # -- Всё, что ниже, выполняется ТОЛЬКО при реальных изменениях --
      - name: Установка Node.js
        if: steps.diff.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установка playwright-core (без скачивания Chromium — берём системный Chrome)
        if: steps.diff.outputs.has_changes == 'true'
        run: npm install playwright-core@1

      - name: Поднять локальный сервер со страницей боя
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          python3 -m http.server 8080 --directory . &
          echo $! > server.pid
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/battle2.html > /dev/null && break
            sleep 0.5
          done

      - name: Сделать скриншоты battle2.html и calendar.html
        if: steps.diff.outputs.has_changes == 'true'
        env:
          SCREENSHOT_URL: "http://localhost:8080/battle2.html"
          SCREENSHOT_OUT: "battle_preview.png"
          SCREENSHOT_URL_CALENDAR: "http://localhost:8080/calendar.html"
          SCREENSHOT_OUT_CALENDAR: "calendar_preview.png"
        run: node screenshot.js

      # -- Заливаем три картинки на Cloudflare Worker: у каждой свой
      #    постоянный URL, а содержимое перезаписывается при каждом прогоне.
      #    Нужны секреты репозитория IMG_WORKER_URL (например
      #    https://battle-images.<аккаунт>.workers.dev) и IMG_WORKER_TOKEN.
      #    Сбой заливки не валит workflow — только предупреждение.
      - name: Залить скриншоты на Cloudflare Worker (постоянные URL)
        if: steps.diff.outputs.has_changes == 'true'
        env:
          IMG_WORKER_URL: ${{ secrets.IMG_WORKER_URL }}
          IMG_WORKER_TOKEN: ${{ secrets.IMG_WORKER_TOKEN }}
        run: |
          if [ -z "${IMG_WORKER_URL:-}" ] || [ -z "${IMG_WORKER_TOKEN:-}" ]; then
            echo "::warning::Секреты IMG_WORKER_URL / IMG_WORKER_TOKEN не заданы — заливку на Worker пропускаю"
            exit 0
          fi
          base="${IMG_WORKER_URL%/}"

          push() {
            file="$1"; name="$2"
            if [ ! -f "$file" ]; then
              echo "Нет файла $file — пропускаю $name.png"
              return 0
            fi
            code=$(curl -sS -o worker_resp.txt -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $IMG_WORKER_TOKEN" \
              -H "Content-Type: image/png" \
              --data-binary "@$file" "$base/$name.png") || code=000
            if [ "$code" = "200" ]; then
              echo "OK: $base/$name.png"
            else
              echo "::warning::Не удалось залить $name.png (HTTP $code): $(cat worker_resp.txt 2>/dev/null)"
            fi
            rm -f worker_resp.txt
          }

          push battle_preview.png   battle
          push calendar_preview.png calendar
          push battle_log.png       log

      - name: Остановить локальный сервер
        if: steps.diff.outputs.has_changes == 'true'
        run: kill "$(cat server.pid)" 2>/dev/null || true

      # -- Коммитим всё разом: и данные, и (если был) новый скриншот --
      - name: Закоммитить изменения
        run: |
          git config user.name  "antio-bot"
          git config user.email "actions@github.com"
          # добавляем только нужные файлы (и только если они существуют) —
          # чтобы не подхватить node_modules/package.json, оставшиеся
          # от установки playwright-core
          for f in actions.json state.json topic.html battle_preview.png battle_log.png calendar_preview.png; do
            [ -f "$f" ] && git add -- "$f"
          done
          if git diff --cached --quiet; then
            echo "Нечего коммитить."
          else
            git commit -m "Обновление темы $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
